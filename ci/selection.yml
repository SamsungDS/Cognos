# Single source of change-based selection.
#
# GitLab includes this file and uses the lists in rules:changes through
# !reference [.selection, <key>]. ci/scripts/plan.sh parses the same file for
# local builds and other SCMs, so both always agree.
#
# Restricted format (enforced by ci/lib/selection.sh):
# - one top-level hidden key '.selection', two-space indentation;
# - each sub-key is a block-style list;
# - each entry is an exact path or '<dir>/**/*' (everything under '<dir>/').
#
# Semantics:
# - platform selects all 8 package components (never amo-prof);
# - <component> selects that component;
# - amo-prof selects the amo-prof jobs only;
# - deploy selects ansible-lint;
# - any other path (cama, .gitmodules, docs, README.md) selects nothing.
.selection:
  platform:
    - components/core/**/*
    - components/mgmt-fw/**/*
    - VERSION
    - build.sh
    - ci/**/*
    - gitlab/**/*
    - .github/**/*
  core:
    - components/core/**/*
  mgmt-fw:
    - components/mgmt-fw/**/*
  cxl:
    - components/cxl/**/*
  slat:
    - components/slat/**/*
  ras:
    - components/ras/**/*
  me:
    - components/me/**/*
  node:
    - components/node/**/*
  sapp:
    - apps/sapp/**/*
  amo-prof:
    - profilers/amo-prof/**/*
  deploy:
    - deploy/**/*

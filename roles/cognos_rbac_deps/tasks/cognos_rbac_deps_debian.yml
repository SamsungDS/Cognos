---
- name: Install required packages for install docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Create keyrings directory
  ansible.legacy.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download and install Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true

- name: Get system architecture (amd64, arm64, etc.)
  ansible.builtin.command: dpkg --print-architecture
  register: cognos_rbac_deps_arch_result
  changed_when: false

- name: Generate Docker APT repository entry
  ansible.builtin.apt_repository:
    repo: >
      deb [arch={{ cognos_rbac_deps_arch_result.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_lsb.codename | default(ansible_distribution_release) }} stable
    filename: docker
    state: present
    update_cache: true

- name: Update apt package cache after adding Docker source
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Restart Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add current user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
    # Note: This task will fail if user is not in sudoers or system doesn't support `usermod`

- name: Notify user about Docker group
  ansible.builtin.debug:
    msg: |
      User "{{ ansible_user_id }}" has been added to the 'docker' group.
      You may need to re-login or restart your session.

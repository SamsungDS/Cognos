---
- name: Check if svk-mgmt-fw DEB is installed
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      apt list --installed | grep svk-mgmt-fw
    executable: /bin/bash
  register: svk_mgmt_fw_remove_deb_query
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Remove the installed svk-mgmt-fw
  ansible.builtin.apt:
    name: svk-mgmt-fw
    state: absent
    purge: true
  become: true
  when: svk_mgmt_fw_remove_deb_query.rc == 0 and ansible_facts['distribution'] == "Ubuntu"

---
- name: Remove default InfluxDB config
  ansible.builtin.command: influx config rm default
  changed_when: false
  failed_when: false
  when: influxdb_uninstall_flag

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Stop InfluxDB
  ansible.builtin.service:
    name: influxdb
    state: stopped
    enabled: false
  become: true
  when:
    - "'influxdb.service' in ansible_facts.services"
    - ansible_facts.services['influxdb.service'].state == 'running'

- name: Remove InfluxDB data directory
  ansible.builtin.file:
    path: "{{ influxdb_data_dir }}"
    state: absent
  when: influxdb_uninstall_flag

- name: Remove InfluxDB package on Debian/Ubuntu
  ansible.builtin.apt:
    name: influxdb2
    purge: true
    state: absent
  when:
    - ansible_facts.os_family == "Debian"
    - influxdb_uninstall_flag

- name: Remove InfluxDB package on OEL/RHEL
  ansible.legacy.dnf:
    name: influxdb2
    state: absent
  when:
    - ansible_facts.os_family == "RedHat"
    - influxdb_uninstall_flag

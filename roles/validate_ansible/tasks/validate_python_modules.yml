---

- name: Check python module version of {{ python_module }}
  ansible.builtin.command: 'python3 -c "import {{ python_module }}; print({{ python_module }}.__version__)"'
  register: validate_ansible_py_mod_ver
  changed_when: false
  failed_when: false

- name: Assert python module installed {{ python_module }}
  ansible.builtin.assert:
    that: validate_ansible_py_mod_ver.rc == 0
    msg: |
       {{ python_module }} python module is not installed on the ansible controller.
       Install from your local console with: 'python3 -m pip install {{ python_module }}'

- name: Assert python module version {{ python_module }}
  ansible.builtin.assert:
    that: validate_ansible_py_mod_ver.stdout is version(python_module_version, '>=')
    msg: |
       {{ python_module }} python module must be >= {{ python_module_version }} on the ansible controller.
       Upgrade from your local console with: 'python3 -m pip install {{ python_module }} --upgrade'

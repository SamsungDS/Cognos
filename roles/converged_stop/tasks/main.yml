---

- name: Get service facts
  ansible.builtin.service_facts:
  when: ansible_facts.services is not defined

- name: Stop svk_converged systemd unit
  ansible.builtin.systemd:
    state: stopped
    name: svk-converged
  when: "'svk-converged.service' in ansible_facts.services"
  become: true

- name: Disable svk_converged systemd unit
  ansible.builtin.systemd:
    name: svk-converged
    enabled: false
  when: "'svk-converged.service' in ansible_facts.services"
  become: true

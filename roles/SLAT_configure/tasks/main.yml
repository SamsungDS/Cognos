- name: Stat svk-mgmt-fw install path
  ansible.builtin.stat:
    path: "{{ mgmt_fw_bin_dir }}"
  register: svk_mgmt_fw_path

- name: Create conf dir for device_sla_config
  file:
    path: "{{ mgmt_fw_bin_dir }}/config/"
    state: directory
    mode: 0644
  when: svk_mgmt_fw_path.stat.exists
  become: true

- name: SLAT configure
  template:
    src: device_sla_config.json.j2
    dest: "{{ mgmt_fw_bin_dir }}/config/device_sla_config.json"






# tasks file for ./roles/SLAT_configure

- name: Stat feat_modules installed path
  ansible.builtin.stat:
    path: "{{ feat_modules_bin_dir }}"
  register: feat_modules_path

- name: Stat svk-cxl installed path
  ansible.builtin.stat:
    path: "{{ svk_cxl_bin_dir }}"
  register: svk_cxl_path

- name: Set symlink for libcxl.so
  file:
    src: "{{ svk_cxl_bin_dir }}/lib64/libcxl.so"
    dest: "{{ feat_modules_bin_dir }}/libcxl.so"
    state: link
    force: true
  when: svk_cxl_path.stat.exists
  become: true


- name: Set symlink for libsvkslat.so
  file:
    src: "{{ feat_modules_bin_dir }}/slat/lib64/libsvkslat.so"
    dest: "{{ feat_modules_bin_dir }}/libsvkslat.so"
    state: link
    force: true
  become: true

- name: SLAT configure for mgmt_fw_config.json
  template:
    src: mgmt_fw_config.json.j2
    dest: /etc/svk/mgmt_fw_config.json
  vars:
    node_ip: "{{ ansible_default_ipv4.address }}"
  when : feat_modules_path.stat.exists



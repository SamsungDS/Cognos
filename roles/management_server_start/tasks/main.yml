---
- name: Get hostname
  ansible.builtin.command: hostname
  register: management_server_start_hostname
  changed_when: false

- name: Configure mgmt_fw_config
  ansible.builtin.template:
    src: mgmt_fw_config.j2
    dest: "/etc/svk/mgmt_fw_config.json"
    mode: 0644
  vars:
    ip: "{{ ansible_default_ipv4.address }}"
    node_name: "{{ management_server_start_hostname.stdout }}"
  become: true

- name: Configure input.json
  ansible.builtin.template:
    src: mgmt_fw_input.j2
    dest: "/usr/local/svk/feature_modules/cxl/config/input.json"
    mode: 0644
  vars:
    node_name: "{{ management_server_start_hostname.stdout }}"
  become: true

- name: Set mock_disable to be true
  ansible.builtin.replace:
    path: /usr/local/svk/feature_modules/cxl/config/cxl_dev_id_map.json
    regexp: '"mock_disable"\s*:\s*false\s*(,?)'
    replace: '"mock_disable": true\1'

- name: Configure app_backend
  ansible.builtin.template:
    src: app_backend_config.j2
    dest: "/usr/local/svk/svk-app/cognos/backend/config/config.json"
    mode: 0644
  vars:
    ip: "{{ ansible_default_ipv4.address }}"
  become: true

- name: Get InfluxDB token
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      influx auth list --user "{{ influxdb_org }}" --json | grep token | cut -d'"' -f4
    executable: /bin/bash
  register: management_server_start_influx_token
  changed_when: false
  failed_when: management_server_start_influx_token.rc != 0

- name: Configure app_influxdb
  ansible.builtin.template:
    src: app_influxdb_config.j2
    dest: "/usr/local/svk/svk-app/cognos/backend/config/influxdb_config.json"
    mode: 0644
  vars:
    influxdb_token: "{{ management_server_start_influx_token.stdout }}"
  become: true

- name: Configure app_ui
  ansible.builtin.template:
    src: app_ui_config.j2
    dest: "/usr/local/svk/svk-app/cognos/ui/src/config/config.json"
    mode: 0644
  vars:
    ip: "{{ ansible_default_ipv4.address }}"
  become: true

- name: Configure app_cognos
  ansible.builtin.template:
    src: app_cognos_config.j2
    dest: "/usr/local/svk/svk-app/cognos.config"
    mode: 0644
  vars:
    management_ip: "{{ ansible_default_ipv4.address }}"
    application_ip: "{{ hostvars[groups['application_server'][0]]['inventory_hostname'] }}"
  become: true

- name: Configure sub_conf
  ansible.builtin.template:
    src: app_sub_config.j2
    dest: "/usr/local/svk/svk-app/cognos/subscriber/sub_config.json"
    mode: 0644
  vars:
    ip: "{{ ansible_default_ipv4.address }}"
  become: true

- name: Start management services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  become: true
  loop:
    - svk-controller.service
    - svk-restserver.service
    - svk-node.service

- name: Gather service status
  ansible.builtin.service_facts:
  changed_when: false

- name: Check service status on management server
  ansible.builtin.assert:
    that:
      - "'{{ item }}' in ansible_facts.services"
      - "ansible_facts.services['{{ item }}'].state == 'running'"
    fail_msg: "{{ item }} failed to start!"
    success_msg: "{{ item }} started successfully."
  loop:
    - svk-controller.service
    - svk-restserver.service
    - svk-node.service

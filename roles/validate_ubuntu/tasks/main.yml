---
- name: Assert Ubuntu version
  ansible.builtin.assert:
    that:
      - ansible_distribution_version is version_compare(min_supported_major_versions, '>=')
      - ansible_distribution_version is version_compare(max_supported_major_versions, '<=')
    fail_msg: |
      Ubuntu version is must be >= {{ min_supported_major_versions }}, <= {{ max_supported_major_versions }}.
      Current version is {{ ansible_distribution_version }}
    success_msg: "Ubuntu version is correct: {{ ansible_distribution_version }}"
  when: ansible_distribution == 'Ubuntu'

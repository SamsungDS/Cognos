- name: Determine OS type and version
  ansible.builtin.set_fact:
    os_family: "{{ ansible_distribution }}"
    os_version: "{{ ansible_distribution_version }}"

- name: Install MySQL
  ansible.builtin.apt:
    name: mysql-server
    state: present
  when: os_family == 'Ubuntu'
  become: true

- name: Start MySQL service
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true
  when: os_family == 'Ubuntu'
  become: true

- name: Execute MySQL secure install
  ansible.builtin.expect:
    command: sudo mysql_secure_installation
    responses:
      'setup VALIDATE PASSWORD component': 'n'
      'Remove anonymous users': 'n'
      'Disallow root login remotely': 'n'
      'Remove test database and access to it': 'n'
      'Reload privilege tables now': 'n'
    timeout: 1
  changed_when: false
  become: true

- name: Check if MySQL user exists
  ansible.builtin.shell: |
    sudo mysql -u root -e "SELECT user FROM mysql.user"
  register: user_exists
  changed_when: false
  become: true

- name: Create MySQL user with full privileges
  ansible.builtin.shell: |
    sudo mysql -u root <<EOF
    CREATE USER '{{ mysql_user }}'@'localhost' IDENTIFIED BY '{{ mysql_user_password }}';
    GRANT ALL PRIVILEGES ON *.* TO '{{ mysql_user }}'@'localhost' WITH GRANT OPTION;
    FLUSH PRIVILEGES;
    EOF
  when: user_exists.stdout.find(mysql_user) == -1
  changed_when: true
  become: true

- name: Verify MySQL user creation
  ansible.builtin.shell: |
    sudo mysql -u root -e "SELECT user FROM mysql.user"
  register: user_query_info
  when: user_exists.stdout.find(mysql_user) == -1
  changed_when: false
  failed_when: user_query_info.stdout.find(mysql_user) == -1
  become: true

- name: Configure apt repository of influx DB
  ansible.builtin.shell: |
    sudo curl -fsSL https://repos.influxdata.com/influxdata-archive_compat.key|sudo gpg --batch --yes --dearmor -o /etc/apt/trusted.gpg.d/influxdata.gpg
  register: influx_db_apt
  failed_when: influx_db_apt.rc != 0
  when: os_family == 'Ubuntu'
  changed_when: false
  become: true

- name: Configure apt source list for influx DB
  ansible.builtin.shell: |
    sudo echo 'deb [signed-by=/etc/apt/trusted.gpg.d/influxdata.gpg] https://repos.influxdata.com/debian stable main' | sudo tee /etc/apt/sources.list.d/influxdata.list
  register: influx_db_source_list
  failed_when: influx_db_source_list.rc != 0
  when: os_family == 'Ubuntu'
  changed_when: false
  become: true

- name: Update apt package cache after adding influxDB source
  ansible.builtin.apt:
    update_cache: true
  when: os_family == 'Ubuntu'
  become: true

- name: Install influx DB
  ansible.builtin.apt:
    name: influxdb2
    state: present
  when: os_family == 'Ubuntu'
  become: true

- name: Start influx DB service
  ansible.builtin.service:
    name: influxdb
    state: started
    enabled: true
  when: os_family == 'Ubuntu'
  become: true

- name: Check if influx DB bucket exists
  ansible.builtin.shell: |
    influx bucket list | awk 'NR > 1 && $2=="{{ influxdb_bucket }}"'
  register: influxdb_bucket_exists
  changed_when: false

- name: Setup influxDB
  ansible.builtin.shell: |
    influx setup --username "{{ influxdb_user }}" --password "{{ influxdb_pwd }}" --org "{{ influxdb_org }}" --bucket "{{ influxdb_bucket }}" --force
  register: influx_setup
  when: influxdb_bucket_exists.stdout == ""
  failed_when: influx_setup.rc != 0

- name: Get InfluxDB token
  ansible.builtin.shell: influx auth list --user "{{ influxdb_org }}" --json | grep token | cut -d'"' -f4
  register: influx_token
  failed_when: influx_token.rc != 0

- name: Display InfluxDB token
  ansible.builtin.debug:
    msg: "InfluxDB_Token={{ influx_token.stdout }}"

- name: Fetch & run NodeJS setup script
  ansible.builtin.shell: |
    sudo curl -fsSL https://deb.nodesource.com/setup_21.x | sudo bash -
  changed_when: false
  when: os_family == 'Ubuntu'
  become: true

- name: Install NodeJS
  ansible.builtin.apt:
    name: nodejs
    state: present
  when: os_family == 'Ubuntu'
  become: true

- name: Install python3.10-venv
  ansible.builtin.apt:
    name: python3.10-venv
    state: present
  when: os_family == 'Ubuntu'
  become: true

- name: Identify svk_app package
  ansible.builtin.find:
    path: "{{ svk_app_pkg_dir }}"
    patterns: "svk-app*-ubuntu{{ os_version }}_*.deb"
  delegate_to: localhost
  run_once: true
  register: svk_app_deb
  when: os_family == "Ubuntu"

- name: Assert svk_app deb found
  ansible.builtin.assert:
    that: svk_app_deb.files | length > 0
    fail_msg: "No svk_app deb found. Please download DEB to {{ artifacts_dir }}"

- name: Identify newest version of svk_app DEB found
  ansible.builtin.set_fact:
    svk_app_deb_file: "{{ (svk_app_deb.files | sort(attribute='mtime', reverse=true) | first).path }}"
  run_once: true

- name: Check if svk_app DEB is installed
  ansible.builtin.shell: "apt list --installed | grep svk-app"
  register: svk_app_deb_query
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Copy svk_app DEB to staging directory
  ansible.builtin.copy:
    src: "{{ svk_app_deb_file }}"
    dest: "{{ deploy_staging_dir }}"
    mode: 0644
  when: svk_app_deb_query.rc != 0

- name: Install svk_app DEB
  ansible.builtin.apt:
    deb: "{{ deploy_staging_dir }}/{{ svk_app_deb_file | basename }}"
    state: present
  become: true
  when: svk_app_deb_query.rc != 0 and ansible_facts['distribution'] == "Ubuntu"

- name: Delete svk_app DEB from staging directory
  ansible.builtin.file:
    path: "{{ deploy_staging_dir }}/{{ svk_app_deb_file | basename }}"
    state: absent

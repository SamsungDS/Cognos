---
- name: Determine OS type and version
  ansible.builtin.set_fact:
    svk_app_install_os_family: "{{ ansible_distribution }}"
    svk_app_install_os_version: "{{ ansible_distribution_version }}"

- name: Configure apt repository of influx DB
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://repos.influxdata.com/influxdata-archive_compat.key | gpg --batch --yes --dearmor -o /etc/apt/trusted.gpg.d/influxdata.gpg
    executable: /bin/bash
  register: svk_app_install_influx_db_apt
  failed_when: svk_app_install_influx_db_apt.rc != 0
  when: svk_app_install_os_family == 'Ubuntu'
  changed_when: false
  become: true

- name: Configure apt source list for influx DB
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      echo 'deb [signed-by=/etc/apt/trusted.gpg.d/influxdata.gpg] https://repos.influxdata.com/debian stable main' | tee /etc/apt/sources.list.d/influxdata.list
    executable: /bin/bash
  register: svk_app_install_influx_db_source_list
  failed_when: svk_app_install_influx_db_source_list.rc != 0
  when: svk_app_install_os_family == 'Ubuntu'
  changed_when: false
  become: true

- name: Update apt package cache after adding influxDB source
  ansible.builtin.apt:
    update_cache: true
  when: svk_app_install_os_family == 'Ubuntu'
  become: true

- name: Install influx DB
  ansible.builtin.apt:
    name: influxdb2
    state: present
  when: svk_app_install_os_family == 'Ubuntu'
  become: true

- name: Start influx DB service
  ansible.builtin.service:
    name: influxdb
    state: started
    enabled: true
  when: svk_app_install_os_family == 'Ubuntu'
  become: true

- name: Setup influxDB
  ansible.builtin.shell: |
    influx setup --username "{{ influxdb_user }}" --password "{{ influxdb_pwd }}" --org "{{ influxdb_org }}" --bucket "{{ influxdb_bucket }}" --force
  changed_when: false
  failed_when: false

- name: Fetch & run NodeJS setup script
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://deb.nodesource.com/setup_21.x | bash -
    executable: /bin/bash
  changed_when: false
  when: svk_app_install_os_family == 'Ubuntu'
  become: true

- name: Install NodeJS
  ansible.builtin.apt:
    name: nodejs
    state: present
  when: svk_app_install_os_family == 'Ubuntu'
  become: true

- name: Install python3.10-venv
  ansible.builtin.apt:
    name: python3.10-venv
    state: present
  when: svk_app_install_os_family == 'Ubuntu'
  become: true

- name: Identify svk_app package
  ansible.builtin.find:
    path: "{{ svk_pkg_dir }}"
    patterns: "svk-app*-ubuntu{{ svk_app_install_os_version }}_*.deb"
  delegate_to: localhost
  run_once: true
  register: svk_app_install_deb
  when: svk_app_install_os_family == "Ubuntu"

- name: Assert svk_app deb found
  ansible.builtin.assert:
    that: svk_app_install_deb.files | length > 0
    fail_msg: "No svk_app deb found. Please download DEB to {{ artifacts_dir }}"

- name: Identify newest version of svk_app DEB found
  ansible.builtin.set_fact:
    svk_app_install_deb_file: "{{ (svk_app_install_deb.files | sort(attribute='mtime', reverse=true) | first).path }}"
  run_once: true

- name: Check if svk_app DEB is installed
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      apt list --installed | grep svk-app
    executable: /bin/bash
  register: svk_app_install_deb_query
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Copy svk_app DEB to staging directory
  ansible.builtin.copy:
    src: "{{ svk_app_install_deb_file }}"
    dest: "{{ deploy_staging_dir }}"
    mode: 0644
  when: svk_app_install_deb_query.rc != 0

- name: Install svk_app DEB
  ansible.builtin.apt:
    deb: "{{ deploy_staging_dir }}/{{ svk_app_install_deb_file | basename }}"
    state: present
  become: true
  when: svk_app_install_deb_query.rc != 0 and ansible_facts['distribution'] == "Ubuntu"

- name: Delete svk_app DEB from staging directory
  ansible.builtin.file:
    path: "{{ deploy_staging_dir }}/{{ svk_app_install_deb_file | basename }}"
    state: absent

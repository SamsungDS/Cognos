- name: Assert converged kernel version
  ansible.builtin.assert:
    that: 
    - ansible_kernel is version_compare(supported_kernel_versions, '>=')
    fail_msg: "Kernel version is must be >= {{ supported_kernel_versions }} . Current version is {{ ansible_kernel }}"
    success_msg: "Kernel version is correct: {{ ansible_kernel }}"

- name: Check CPU numbers of converged node
  ansible.builtin.assert:
    that: ansible_processor_vcpus >= {{ min_required_cpu_numbers }}
    fail_msg: "CPU numbers is must be >= {{ min_required_cpu_numbers }} . Current number is {{ ansible_processor_vcpus }}"
    success_msg: "CPU numbers is correct: {{ ansible_processor_vcpus }}"

- name: Install nvme-cli on converged node
  ansible.builtin.apt:
    name: nvme-cli
    state: present
  when: ansible_os_family == "Debian"
  
- name: Get nvme devices count on converged node
  ansible.builtin.shell: lspci | grep 'Non-Volatile memory' | wc -l
  register: nvme_device_count

- name: Assert nvme devices count on converged node
  ansible.builtin.assert:
    that: 
    - nvme_device_count.stdout|int >= {{ min_nvme_dev_nums }}
    fail_msg: "Number of NVMe devices is not greater than {{ min_nvme_dev_nums }} . Current number of devices: {{ nvme_device_count.stdout }}"
    success_msg: "Number of NVMe devices is correct: {{ nvme_device_count.stdout }}"

- name: Get total memory in GB
  ansible.builtin.shell: free -g | grep Mem | awk '{print $2}'
  register: total_memory

- name: Assert memory is greater than 4GB in VM mode
  ansible.builtin.assert:
    that:
      - total_memory.stdout|int >= {{ min_host_memory_gb }} 
    fail_msg: "Memory is not sufficient in VM mode. Current memory: {{ total_memory.stdout }} GB"
    success_msg: "Memory is sufficient: {{ total_memory.stdout }} GB"
  when: host_type == "vm"

- name: Assert memory is greater than 64GB in Server mode
  ansible.builtin.assert:
    that:
      - total_memory.stdout|int >= {{ min_host_memory_gb }} 
    fail_msg: "Memory is not sufficient in Server mode. Current memory: {{ total_memory.stdout }} GB"
    success_msg: "Memory is sufficient: {{ total_memory.stdout }} GB"
  when: host_type == "server"


- name: Check if ublk_drv module is installed on the OS
  ansible.builtin.modprobe: 
    name: "ublk_drv"
    state: present
  become: true







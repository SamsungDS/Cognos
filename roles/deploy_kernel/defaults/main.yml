---

### Path defaults
deploy_kernel_artifacts_dir: "{{ inventory_dir }}/artifacts"
deploy_kernel_staging_dir: /tmp/kernel

### Kernel defaults
deploy_kernel_version: 6.11.11

deploy_kernel_source_code_url: "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-{{ deploy_kernel_version }}.tar.xz"

### kernel dependencies packages name
deploy_kernel_dependencies_apt:
  - git
  - fakeroot
  - build-essential
  - ncurses-dev
  - xz-utils
  - libssl-dev
  - bc
  - flex
  - libelf-dev
  - bison

### Reboot defaults
deploy_kernel_reboot_timeout: 3600

---
### Path defaults
artifacts_dir: "{{ inventory_dir }}/artifacts"
deploy_kernel_staging_dir: /tmp/kernel

### Kernel defaults
kernel_version: "6.11.11"

kernel_source_code_url: "https://cdn.kernel.org/pub/linux/kernel/v{{ kernel_version[:1] }}.x/linux-{{ kernel_version }}.tar.xz"

###kernel dependencies packages name
_kernel_requirements:
  default:
    - git
    - fakeroot
    - build-essential
    - ncurses-dev 
    - xz-utils 
    - libssl-dev
    - bc
    - flex
    - libelf-dev
    - bison
  Ubuntu:
    - git
    - fakeroot
    - build-essential
    - ncurses-dev 
    - xz-utils 
    - libssl-dev
    - bc
    - flex
    - libelf-dev
    - bison
  Rocky:
    - bc
    - diffutils
    - flex
    - hostname
    - openssl-devel
    - bison
    - elfutils-libelf-devel


kernel_dependencies: "{{ _kernel_requirements[ansible_distribution] | default(_kernel_requirements['default']) }}"
###compile timeout
compile_timeout: 7200
compile_check_retries: 120
compile_check_interval: 60
available_disk_size_gb: 29

### Reboot defaults
reboot_timeout: 3600

### update-grub.cfg order
prefix_grub_default: 90


_kernel_modules_location:
  default: /usr/lib/modules/{{ kernel_version }}
  Ubuntu: /lib/modules/{{ kernel_version }}
  Rocky: /usr/lib/modules/{{ kernel_version }}

kernel_modules_location: "{{ _kernel_modules_location[ansible_distribution] | default(_kernel_modules_location['default']) }}"

_kernel_installation_location:
  default: /boot/vmlinuz
  Ubuntu: /boot/vmlinuz-{{ kernel_version }}
  Rocky: /boot/vmlinuz

kernel_installation_location: "{{ _kernel_installation_location[ansible_distribution] | default(_kernel_installation_location['default']) }}"

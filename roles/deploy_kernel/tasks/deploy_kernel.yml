---
- name: Get current kernel version
  ansible.builtin.set_fact:
    curr_kernel_version: "{{ ansible_kernel.split('-')[0] }}"

- name: Assert kernel version on target node
  ansible.builtin.assert:
    that: curr_kernel_version is version_compare(kernel_version, '<')
    fail_msg: "To upgrade kernel, current kernel version is must be < {{ kernel_version }} . Current version is {{ curr_kernel_version }}"
    success_msg: "Kernel version is correct: {{ curr_kernel_version }}"

- name: Install dependencies packages
  become: yes
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  with_items: "{{ kernel_dependencies }}"

- name: download kernel
  get_url:
    url: "{{ kernel_source_code_url }}"
    dest: "{{ artifacts_dir }}/linux-{{ kernel_version }}.tar.xz"
    mode: 0644
  delegate_to: localhost
  run_once: true

- name: Get kernel tarball status
  stat:
    path: "{{ artifacts_dir }}/linux-{{ kernel_version }}.tar.xz"
  delegate_to: localhost
  register: kernel_tgz_stat

- name: Assert kernel tarball found
  assert:
    that: kernel_tgz_stat.stat.exists
    fail_msg: "Kernel tarball not found. Please download it to {{ artifacts_dir }}"

- name: Create kernel source code destination path
  file:
    path: "{{ deploy_kernel_staging_dir }}"
    state: directory
    mode: 0755
  become: true


- name: Copy kernel tarball to specified node
  copy:
    src: "{{ kernel_tgz_stat.stat.path }}"
    dest: "{{ deploy_kernel_staging_dir }}"
    owner: root
    group: root
    mode: 0555
  become: true
  run_once: true

- name: Check if unzipped kernelsource directory exists
  stat:
    path: "{{ deploy_kernel_staging_dir }}/linux-{{ kernel_version }}"
  register: unzip_dir_stat

- name: untar kernel source code
  shell: tar -Jxvf linux-{{ kernel_version }}.tar.xz
  args:
    chdir: "{{ deploy_kernel_staging_dir }}/"
  become: true
  run_once: true
  when: unzip_dir_stat.stat.exists == false

- name: Copy current kernel config as kernel_source config file
  copy:
    src: "/boot/config-{{ ansible_kernel }}"
    dest: "{{ deploy_kernel_staging_dir }}/linux-{{ kernel_version }}/.config"
    owner: root
    group: root
    mode: 0644
    remote_src: true
  become: true

- name: fix for singed keys issue
  ansible.builtin.shell: |
    ./scripts/config --disable SYSTEM_REVOCATION_KEYS
    ./scripts/config --disable SYSTEM_TRUSTED_KEYS
  args:
    chdir: "{{ deploy_kernel_staging_dir }}/linux-{{ kernel_version }}/"
  become: true
    
- name: Compile kernel by source code - make
  ansible.builtin.command:
    cmd: make -j{{ ansible_processor_vcpus }}
    chdir: "{{ deploy_kernel_staging_dir }}/linux-{{ kernel_version }}"
    creates: "{{ deploy_kernel_staging_dir }}/linux-{{ kernel_version }}/vmlinux"
  async: 1800
  poll: 0
  register: kernel_make
  changed_when: false

- name: Wait for make
  ansible.builtin.async_status:
    jid: "{{ kernel_make.ansible_job_id }}"
  register: kernel_wait_for_make
  until:
    - kernel_wait_for_make.finished
  retries: 100
  delay: 30

- name: Make modules_install
  ansible.builtin.command:
    cmd: make INSTALL_MOD_STRIP=1 modules_install
    chdir: "{{ deploy_kernel_staging_dir }}/linux-{{ kernel_version }}"
    creates: "{{ kernel_modules_location }}"

- name: Assert kernel directory exists
  ansible.builtin.file:
    path: "{{ kernel_installation_location | dirname }}"
    state: directory
    mode: "0750"

- name: Make install
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ deploy_kernel_staging_dir }}/linux-{{ kernel_version }}"
    creates: "{{ kernel_installation_location }}"


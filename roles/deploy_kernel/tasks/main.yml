---

- name: Assert Test kernel_version
  ansible.builtin.assert:
    that:
      - kernel_version is defined
      - kernel_version is string
      - kernel_version is not none
    quiet: true

- name: Assert deploy_kernel_staging_dir
  ansible.builtin.assert:
    that:
      - deploy_kernel_staging_dir is defined
      - deploy_kernel_staging_dir is string
      - deploy_kernel_staging_dir is not none
    quiet: true

- name: Upgrade kernel for ubuntu
  ansible.builtin.include_tasks: 
    file: deploy_kernel.yml
  tags:
      - upgrade_kernel

- name: Set GRUB Commandline Options
  import_tasks: set_grub_ubuntu.yml
  when: ansible_distribution == "Ubuntu"

- name: Update grub
  import_tasks: update_grub.yml

- name: Flush handlers
  meta: flush_handlers

- name: Assert host kernel version
  assert:
    that: ansible_kernel is version (kernel_version, '==')
    fail_msg: "Expected kernel version {{ kernel_version }} but found {{ ansible_kernel }}"
    success_msg: "Detected host kernel version {{ kernel_version }}"
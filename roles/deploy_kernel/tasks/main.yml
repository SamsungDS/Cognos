---

- name: Assert Test kernel_version
  ansible.builtin.assert:
    that:
      - kernel_version is defined
      - kernel_version is string
      - kernel_version is not none
    quiet: true

- name: Assert deploy_kernel_staging_dir
  ansible.builtin.assert:
    that:
      - deploy_kernel_staging_dir is defined
      - deploy_kernel_staging_dir is string
      - deploy_kernel_staging_dir is not none
    quiet: true

- name: download kernel
  get_url:
    url: "{{ kernel_source_code_url }}"
    dest: "{{ artifacts_dir }}/linux-{{ kernel_version }}.tar.xz"
    mode: 0644
  delegate_to: localhost
  run_once: true

- name: Get kernel tarball status
  stat:
    path: "{{ artifacts_dir }}/linux-{{ kernel_version }}.tar.xz"
  delegate_to: localhost
  register: kernel_tgz_stat

- name: Assert kernel tarball found
  assert:
    that: kernel_tgz_stat.stat.exists
    fail_msg: "Kernel tarball not found. Please download it to {{ artifacts_dir }}"

- name: Get current kernel version
  ansible.builtin.set_fact:
    curr_kernel_version: "{{ ansible_kernel.split('-')[0] }}"

- name: Assert kernel version on target node
  ansible.builtin.assert:
    that: curr_kernel_version is version_compare(kernel_version, '<')
    fail_msg: "To upgrade kernel, current kernel version is must be < {{ kernel_version }} . Current version is {{ curr_kernel_version }}"
    success_msg: "Kernel version is correct: {{ curr_kernel_version }}"
  ignore_errors: yes
  register: assert_kernel_version

- name: Get the capacity of the root partition('/')
  ansible.builtin.command: " df -h --block-size=1GB / "
  register: root_partition_capacity

- name: "Check the capacity of the root partition('/') is greater than {{ available_disk_size_gb }}GB"
  ansible.builtin.assert:
    that: root_partition_capacity.stdout_lines[1].split()[3] | int >= {{ available_disk_size_gb }}
    fail_msg: "To upgrade kernel, available disk capacity must be >= {{ available_disk_size_gb }}GB . Current is {{ root_partition_capacity.stdout_lines[1].split()[3] }}GB"
    success_msg: "Current capacity of '/' is {{ root_partition_capacity.stdout_lines[1].split()[3] }}GB"
  ignore_errors: yes
  register: assert_disk_available

- name: Upgrade kernel for ubuntu
  ansible.builtin.include_tasks: 
    file: deploy_kernel.yml
  tags:
      - upgrade_kernel
  when: assert_kernel_version.failed == false and assert_disk_available.failed == false

- name: Set GRUB Commandline Options
  import_tasks: set_grub_ubuntu.yml
  when: 
    - ansible_distribution == "Ubuntu" and assert_kernel_version.failed == false and assert_disk_available.failed == false

- name: Update grub
  import_tasks: update_grub.yml

- name: Flush handlers
  meta: flush_handlers

- name: Assert host kernel version
  assert:
    that: ansible_kernel is version (kernel_version, '==')
    fail_msg: "Expected kernel version {{ kernel_version }} but found {{ ansible_kernel }}"
    success_msg: "Detected host kernel version {{ kernel_version }}"

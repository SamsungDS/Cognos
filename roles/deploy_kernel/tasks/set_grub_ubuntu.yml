#   submenu 'Advanced options for Ubuntu' $menuentry_id_option 'gnulinux-advanced-fd7a9e9d-2e34-4852-9e70-e3a37a54272e' {
#        menuentry 'Ubuntu, with Linux 6.11.11' --class ubuntu --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-6.11.11-advanced-fd7a9e9d-2e34-4852-9e70-e3a37a54272e' {

# - name: Get all installed kernel versions
#   shell: 
#     awk '/menuentry/ && /class/ {count++; print count-1"****"$0 }' /boot/grub/grub.cfg
#   register: installed_kernel_versions
#   ignore_errors: yes

# - name: Debug installed_kernel_versions
#   debug:
#     var: installed_kernel_versions.stdout

# - name: Get target menuentry id
#   set_fact:
#     target_menuentry_id: "{{ installed_kernel_versions.stdout | split('\n') | select('search', kernel_version) | first | split('****') | first }}"

# - name: Debug target_menuentry_id
#   debug:
#     msg: "{{ target_menuentry_id }}"

- name: get target menuentry_id_option of {{ kernel_version }}
  shell: "awk '/\\$menuentry_id_option/ {print $(NF-1) }' /boot/grub/grub.cfg | sed s/\\'//g | grep -v recovery | grep -F {{ kernel_version }}"
  register: target_menuentry_id
  when: kernel_version is defined


- name: Transform kernel_version to regex
  set_fact:
    kernel_version_trans: "{{ kernel_version | regex_replace('\\.', '\\.') }}"


- name: Get parent menuentry id
  set_fact:
    parent_menuentry_id: "{{ target_menuentry_id.stdout | regex_replace(kernel_version_trans+'-', '') }}"

- name: set value for kernel grub update
  set_fact:
    kernel_update_grub_default: "{{ parent_menuentry_id }}>{{ target_menuentry_id.stdout }}"

- name: Debug kernel_update_grub_default
  debug:
    msg: "{{ kernel_update_grub_default }}"
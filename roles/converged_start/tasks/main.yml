# Contact: june.liu@samsung.com
---
- name: Check if svk_converged DEB is installed
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      apt list --installed | grep svk-converged;echo $?
    executable: /bin/bash
  register: converged_start_deb_query
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Assert svk_converged DEB is installed
  ansible.builtin.assert:
    that: converged_start_deb_query.stdout_lines[-1]  == '0'
    fail_msg: "Package svk_converged is not installed. Please run 'ansible-playbook deploy_cognos_converged.yml' first"

- name: Get service facts
  ansible.builtin.service_facts:
  when: ansible_facts.services is not defined

- name: Enable svk_converged systemd unit
  ansible.builtin.systemd:
    name: svk-converged
    enabled: true
  when: "'svk-converged.service' in ansible_facts.services"
  become: true

- name: Start svk_converged systemd unit
  ansible.builtin.systemd:
    enabled: true
    state: started
    name: svk-converged
  when: "'svk-converged.service' in ansible_facts.services"
  become: true

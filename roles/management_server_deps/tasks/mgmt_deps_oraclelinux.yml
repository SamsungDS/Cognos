---
- name: Install prerequisites for install influxdb and docker
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - curl
      - gnupg
      - tar
    state: present

- name: Configure GPG key for InfluxDB (OEL)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl --silent --location -O https://repos.influxdata.com/influxdata-archive.key
      gpg --show-keys --with-fingerprint --with-colons ./influxdata-archive.key 2>&1 |
      grep -q '^fpr:\+24C975CBA61A024EE1B631787C3D57159FC2F927:$' && cat influxdata-archive.key |
      gpg --dearmor |
      tee /etc/pki/rpm-gpg/RPM-GPG-KEY-influxdata > /dev/null
    executable: /bin/bash
  register: management_server_deps_influxdb_db_dnf
  failed_when: management_server_deps_influxdb_db_dnf.rc != 0
  changed_when: false
  become: true

- name: Add InfluxDB repo
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/influxdata.repo
    mode: "0644"
    content: |
      [influxdata]
      name = InfluxData Repository - Stable
      baseurl = https://repos.influxdata.com/stable/${basearch}/main
      enabled = 1
      gpgcheck = 1
      gpgkey = file:///etc/pki/rpm-gpg/RPM-GPG-KEY-influxdata

- name: Install InfluxDB 2
  ansible.builtin.dnf:
    name: influxdb2
    state: present

- name: Start influx DB service
  ansible.builtin.service:
    name: influxdb
    state: started
    enabled: true
  become: true

- name: Check if influx command is available
  ansible.builtin.command: which influx
  register: management_server_deps_influxdb_stat
  ignore_errors: true
  failed_when: false
  changed_when: false

- name: Check if Influx cli artifact exists locally
  ansible.builtin.stat:
    path: "{{ artifacts_dir }}/influxdb2-client-*.tar.gz"
  register: management_server_deps_influxdb_cli
  when: management_server_deps_influxdb_stat.rc

- name: Download InfluxDB2 Client to localhost artifacts directory if not present
  ansible.builtin.get_url:
    url: https://dl.influxdata.com/influxdb/releases/influxdb2-client-2.7.5-linux-amd64.tar.gz
    dest: "{{ artifacts_dir }}"
    mode: "0644"
  register: management_server_deps_influxdb_download
  delegate_to: localhost
  when:
    - management_server_deps_influxdb_stat.rc
    - not management_server_deps_influxdb_cli.stat.exists

- name: Find influxdb2-client tarball in artifacts directory
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      find "{{ artifacts_dir }}" -name "influxdb2-client-*.tar.gz" | head -n 1
    executable: /bin/bash
  register: management_server_deps_influxdb_tar
  changed_when: false
  delegate_to: localhost
  when: management_server_deps_influxdb_stat.rc

- name: Copy InfluxDB2 client tarball to remote /tmp
  ansible.builtin.copy:
    src: "{{ management_server_deps_influxdb_tar.stdout }}"
    dest: /tmp/influxdb2-client.tar.gz
    mode: '0644'
  when:
    - management_server_deps_influxdb_stat.rc
    - not management_server_deps_influxdb_tar.rc

- name: Extract InfluxDB2 Client to remote /tmp
  ansible.builtin.unarchive:
    src: /tmp/influxdb2-client.tar.gz
    dest: /usr/local/bin
    mode: '0755'
    remote_src: true
  when:
    - management_server_deps_influxdb_stat.rc

- name: Execute influx config command to check if instance is set up
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      influx config list | grep "{{ influxdb_org }}"
    executable: /bin/bash
  register: management_server_deps_instance
  changed_when: false
  failed_when: false

- name: Delete InfluxDB2 client tarball from /tmp
  ansible.builtin.file:
    path: /tmp/influxdb2-client.tar.gz
    state: absent

- name: Setup influxDB
  ansible.builtin.shell: |
    influx setup --username "{{ influxdb_user }}" --password "{{ influxdb_pwd }}" --org "{{ influxdb_org }}" --bucket "{{ influxdb_bucket }}" --force
  when: management_server_deps_instance.rc
  changed_when: false

- name: Fetch & run NodeJS setup script
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://rpm.nodesource.com/setup_21.x | bash -
    executable: /bin/bash
  changed_when: false
  become: true

- name: Install NodeJS
  ansible.builtin.dnf:
    name: nodejs
    state: present
  become: true

- name: Install required packages[telegraf]
  ansible.builtin.dnf:
    name: telegraf
    state: present

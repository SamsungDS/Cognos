---
- name: Determine OS type and version
  ansible.builtin.set_fact:
    management_server_deps_os_family: "{{ ansible_distribution }}"
    management_server_deps_os_version: "{{ ansible_distribution_version }}"

- name: Configure apt repository of influx DB
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://repos.influxdata.com/influxdata-archive.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/influxdata-archive.gpg > /dev/null
    executable: /bin/bash
  register: management_server_deps_influx_db_apt
  failed_when: management_server_deps_influx_db_apt.rc != 0
  when: management_server_deps_os_family == 'Ubuntu'
  changed_when: false
  become: true

- name: Configure apt source list for influx DB
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      set -o pipefail
      echo "deb [signed-by=/etc/apt/trusted.gpg.d/influxdata-archive.gpg] https://repos.influxdata.com/debian stable main" |
      sudo tee /etc/apt/sources.list.d/influxdata.list
    executable: /bin/bash
  register: management_server_deps_influx_db_source_list
  failed_when: management_server_deps_influx_db_source_list.rc != 0
  when: management_server_deps_os_family == 'Ubuntu'
  changed_when: false
  become: true

- name: Update apt package cache after adding influxDB source
  ansible.builtin.apt:
    update_cache: true
  when: management_server_deps_os_family == 'Ubuntu'
  become: true

- name: Install influx DB
  ansible.builtin.apt:
    name: influxdb2
    state: present
  when: management_server_deps_os_family == 'Ubuntu'
  become: true

- name: Start influx DB service
  ansible.builtin.service:
    name: influxdb
    state: started
    enabled: true
  when: management_server_deps_os_family == 'Ubuntu'
  become: true

- name: Setup influxDB
  ansible.builtin.shell: |
    influx setup --username "{{ influxdb_user }}" --password "{{ influxdb_pwd }}" --org "{{ influxdb_org }}" --bucket "{{ influxdb_bucket }}" --force
  changed_when: false
  failed_when: false

- name: Fetch & run NodeJS setup script
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://deb.nodesource.com/setup_21.x | bash -
    executable: /bin/bash
  changed_when: false
  when: management_server_deps_os_family == 'Ubuntu'
  become: true

- name: Install NodeJS
  ansible.builtin.apt:
    name: nodejs
    state: present
  when: management_server_deps_os_family == 'Ubuntu'
  become: true

- name: Install python3.10-venv
  ansible.builtin.apt:
    name: python3.10-venv
    state: present
  when: management_server_deps_os_family == 'Ubuntu'
  become: true

- name: Install required packages[telegraf]
  ansible.builtin.apt:
    name:
      - telegraf
    state: present

- name: Install required packages for install docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Create keyrings directory
  ansible.legacy.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download and install Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true
  when: management_server_deps_os_family == 'Ubuntu'

- name: Get system architecture (amd64, arm64, etc.)
  ansible.builtin.command: dpkg --print-architecture
  register: management_server_deps_arch_result
  changed_when: false
  when: management_server_deps_os_family == 'Ubuntu'

- name: Generate Docker APT repository entry
  ansible.builtin.apt_repository:
    repo: >
      deb [arch={{ management_server_deps_arch_result.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_lsb.codename | default(ansible_distribution_release) }} stable
    filename: docker
    state: present
    update_cache: true
  when: management_server_deps_os_family == 'Ubuntu'

- name: Update apt package cache after adding Docker source
  ansible.builtin.apt:
    update_cache: true
  when: management_server_deps_os_family == 'Ubuntu'
  become: true

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: management_server_deps_os_family == 'Ubuntu'

- name: Restart Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add current user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
    # Note: This task will fail if user is not in sudoers or system doesn't support `usermod`

- name: Notify user about Docker group
  ansible.builtin.debug:
    msg: |
      User "{{ ansible_user_id }}" has been added to the 'docker' group.
      You may need to re-login or restart your session.

---
- name: Install required packages for install influxdb
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - tar
    state: present

- name: Configure GPG key of influx DB
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://repos.influxdata.com/influxdata-archive.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/influxdata-archive.gpg > /dev/null
    executable: /bin/bash
  register: management_server_deps_influx_db_apt
  failed_when: management_server_deps_influx_db_apt.rc != 0
  changed_when: false
  become: true

- name: Configure apt source list for influx DB
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      set -o pipefail
      echo "deb [signed-by=/etc/apt/trusted.gpg.d/influxdata-archive.gpg] https://repos.influxdata.com/debian stable main" |
      sudo tee /etc/apt/sources.list.d/influxdata.list
    executable: /bin/bash
  register: management_server_deps_influx_db_source_list
  failed_when: management_server_deps_influx_db_source_list.rc != 0
  changed_when: false
  become: true

- name: Update apt package cache after adding influxDB source
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install influx DB
  ansible.builtin.apt:
    name: influxdb2
    state: present
  become: true

- name: Start influx DB service
  ansible.builtin.service:
    name: influxdb
    state: started
    enabled: true
  become: true

- name: Execute influx config command to check if instance is set up
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      influx config list | grep "{{ influxdb_org }}"
    executable: /bin/bash
  register: management_server_deps_instance
  changed_when: false
  failed_when: false

- name: Setup influxDB
  ansible.builtin.shell: |
    influx setup --username "{{ influxdb_user }}" --password "{{ influxdb_pwd }}" --org "{{ influxdb_org }}" --bucket "{{ influxdb_bucket }}" --force
  changed_when: false
  when: management_server_deps_instance.rc

- name: Fetch & run NodeJS setup script
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://deb.nodesource.com/setup_21.x | bash -
    executable: /bin/bash
  changed_when: false
  become: true

- name: Install NodeJS
  ansible.builtin.apt:
    name: nodejs
    state: present
  become: true

- name: Install python3.10-venv
  ansible.builtin.apt:
    name: python3.10-venv
    state: present
  become: true

- name: Install required packages[telegraf]
  ansible.builtin.apt:
    name:
      - telegraf
    state: present

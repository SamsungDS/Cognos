---
- name: Stat converged installed path
  ansible.builtin.stat:
    path: "{{ converged_config_path }}"
  register: converged_config_file

- name: Assert converged installed path exists
  ansible.builtin.assert:
    that: converged_config_file.stat.exists
    fail_msg: SVK_converged is not installed. Execute 'deploy_cognos_software.yml' playbook first.

- name: Set hugepages and move NVMe devices to user space mode
  ansible.builtin.shell:
    cmd: "NRHUGE={{ converged_config_nrhuge }} {{ converged_config_path }}/scripts/setup.sh"
    executable: /bin/bash
  register: converged_config_setup
  changed_when: converged_config_setup.stdout is search('nvme -> vfio-pci')
  when: converged_config_file.stat.exists
  become: true

- name: Check setup status
  ansible.builtin.debug:
    msg: "Set hugepages= {{ converged_config_nrhuge }} and {{ converged_config_setup }}"
  when: converged_config_setup.rc != 0

- name: Set the specified COREMASK in svk-converged.conf file
  ansible.builtin.template:
    src: svk-converged.conf.j2
    dest: "{{ converged_config_path }}/config/svk-converged.conf"
    mode: "0644"
  when: converged_config_coremask is defined

- name: Display the modified CORE_MASK
  ansible.builtin.debug:
    msg: "The modified COREMASK is {{ converged_config_coremask }}"

- name: Stat converged installed path
  ansible.builtin.stat:
    path: "{{ converged_bin_path }}"
  register: converged_path

- name: Assert converged installed path exists
  ansible.builtin.assert:
    that: converged_path.stat.exists
    fail_msg: SVK_converged is not installed. Execute 'deploy_cognos_software.yml' playbook first.

- name: Set hugepages and move NVMe devices to user space mode
  ansible.builtin.shell: 
    "NRHUGE={{ NRHUGE }} {{ converged_bin_path }}/scripts/setup.sh"
  register: converged_setup
  changed_when: converged_setup.stdout is search('nvme -> vfio-pci')
  when: converged_path.stat.exists
  become: true

- name: check setup status
  ansible.builtin.debug: 
    msg: "Set hugepages= {{ NRHUGE }} and {{ converged_setup }}"
  when: converged_setup.rc != 0



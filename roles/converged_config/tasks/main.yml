- name: Set the specified COREMASK in svk-converged.conf file
  template:
    src: svk-converged.conf.j2
    dest: "{{ converged_bin_path }}/config/svk-converged.conf"
  when: COREMASK is defined

- name: Display the modified CORE_MASK
  ansible.builtin.debug: 
    msg: "The modified coremask is {{ COREMASK }}"


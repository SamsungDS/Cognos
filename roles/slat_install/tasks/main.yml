---
# Author: June Liu
# Contact: june.liu@samsung.com

- name: Determine OS type and version
  ansible.builtin.set_fact:
    slat_install_os_family: "{{ ansible_distribution }}"
    slat_install_os_version: "{{ ansible_distribution_version }}"

- name: Identify svk_slat package
  ansible.builtin.find:
    path: "{{ slat_install_pkg_dir }}"
    patterns: "svk-slat_*-ubuntu{{ slat_install_os_version }}_*.deb"
  delegate_to: localhost
  run_once: true
  register: slat_install_deb
  when: slat_install_os_family == "Ubuntu"

- name: Assert svk_slat deb found
  ansible.builtin.assert:
    that: slat_install_deb.files | length > 0
    fail_msg: "No svk-slat deb found. Please download DEB to {{ slat_install_artifacts_dir }}"

- name: Identify newest version of svk-slat DEB found
  ansible.builtin.set_fact:
    slat_install_deb_file: "{{ (slat_install_deb.files | sort(attribute='mtime', reverse=true) | first).path }}"
  run_once: true

- name: Check if svk-slat DEB is installed
  ansible.builtin.shell:
    cmd: "set -o pipefail && apt list --installed | grep svk-slat; echo $?"
    executable: /bin/bash
  register: slat_install_deb_query
  changed_when: false
  when: slat_install_os_family == "Ubuntu"

- name: Copy svk_slat DEB to staging directory
  ansible.builtin.copy:
    src: "{{ slat_install_deb_file }}"
    dest: "{{ slat_install_staging_dir }}"
    mode: "0644"
  when: slat_install_deb_query.stdout_lines[-1] != '0'


- name: Install svk_slat DEB
  ansible.builtin.apt:
    deb: "{{ slat_install_staging_dir }}/{{ slat_install_deb_file | basename }}"
    state: present
  become: true
  when: slat_install_deb_query.stdout_lines[-1] != '0' and slat_install_os_family == "Ubuntu"

- name: Delete svk_slat DEB from staging directory
  ansible.builtin.file:
    path: "{{ slat_install_staging_dir }}/{{ slat_install_deb_file | basename }}"
    state: absent

- name: Install svk_cxl on SLA Tracker node
  ansible.builtin.include_role:
    name: svk_cxl_install
  vars:
    svk_cxl_install_pkg_dir: "{{ slat_install_pkg_dir }}"

---

- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
  when: ansible_distribution == 'Ubuntu'
  become: true

- name: Install python3-pip from the distribution repository
  ansible.builtin.apt:
    name: python3-pip
    state: present

- name: Install required Python packages with pip3
  ansible.builtin.pip:
    name: "{{ item }}"
    executable: pip3
  loop:
    - distro
    - psutil
    - py-libnuma==1.2

---

- name: Check pip3 for svk-me install
  ansible.builtin.package:
    name: python3-pip
    state: present
  become: true

- name: Check damo on Ubuntu 24.04+
  ansible.builtin.package:
    name: damo
    state: present
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_version is version_compare("24.04", '>=')

- name: Install damo and pyyaml on Ubuntu 22.04
  ansible.builtin.pip:
    name:
      - damo==2.7.2
      - PyYAML
    executable: pip3
    state: present
    extra_args: "--force-reinstall --no-deps"
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_version == "22.04"

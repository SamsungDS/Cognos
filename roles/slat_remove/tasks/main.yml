# Author: June Liu
# Contact: june.liu@samsung.com

- name: Remove svk_slat packages
  ansible.builtin.apt:
    name: svk-slat
    state: absent
    purge: true
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Uninstall SLA Tracker dependencies[svk-mgmt-fw]
  ansible.builtin.include_role:
    name: svk_mgmt_fw_remove

- name: Uninstall SLA Tracker dependencies[svk-core]
  ansible.builtin.include_role:
    name: svk_core_remove

- name: Update systemd configuration
  ansible.builtin.systemd:
    daemon-reload: true
  become: true

- name: Delete log files, config and installation directories of SLA Tracker
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ slat_remove_log_path }}"
    - "{{ slat_remove_conf_path }}"
    - "{{ slat_remove_feat_modules_bin_dir }}"
    - "{{ slat_remove_mgmt_fw_bin_dir }}"
  become: true

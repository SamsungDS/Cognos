---
- name: Check if svk_app DEB is installed
  ansible.builtin.shell: "apt list --installed | grep svk-app"
  register: svk_app_deb_query
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Remove the installed svk-app
  ansible.builtin.apt:
    name: svk-app
    state: absent
    purge: true
  become: true
  when: svk_app_deb_query.rc == 0 and ansible_facts['distribution'] == "Ubuntu"

- name: Remove the svk-app directory
  ansible.builtin.file:
    path: "{{ svk_install_dir }}"
    state: absent

---
- name: Get hostname
  ansible.builtin.command: hostname
  register: application_server_start_hw_hostname
  changed_when: false

- name: Configure mgmt_fw_config
  ansible.builtin.template:
    src: mgmt_fw_config.j2
    dest: "/etc/svk/mgmt_fw_config.json"
    mode: "0644"
  vars:
    ip: "{{ ansible_default_ipv4.address }}"
    node_name: "{{ application_server_start_hw_hostname.stdout }}"
  become: true

- name: Configure zmq
  ansible.builtin.template:
    src: zmq_config.j2
    dest: "/etc/svk/zmq_config.json"
    mode: "0644"
  vars:
    ip: "{{ ansible_default_ipv4.address }}"
  become: true

- name: Set mock_disable to be true
  ansible.builtin.replace:
    path: /usr/local/svk/feature_modules/cxl/config/cxl_dev_id_map.json
    regexp: '"mock_disable"\s*:\s*false\s*(,?)'
    replace: '"mock_disable": true\1'

- name: Configure input.json when device type is CMMH
  ansible.builtin.template:
    src: cmmd_mgmt_fw_input.j2
    dest: "/usr/local/svk/feature_modules/cxl/config/input.json"
    mode: "0644"
  become: true
  when: application_server_type == 'CMMH'

- name: Ensure python3 interpreter is set
  ansible.builtin.set_fact:
    application_server_start_hw_py3: >-
      {{
        (ansible_python_interpreter is defined
          and 'python3' in ansible_python_interpreter
          and ansible_python_interpreter | basename | regex_search('^python3$')
        ) | ternary(
          ansible_python_interpreter,
          '/usr/bin/python3'
        )
      }}

- name: Check python3 binary exists
  ansible.builtin.stat:
    path: "{{ application_server_start_hw_py3 }}"
  register: application_server_start_hw_py3_stat
  changed_when: false

- name: Fail if python3 not found
  ansible.builtin.fail:
    msg: "python3 interpreter not found at {{ application_server_start_hw_py3 }}"
  when: not (application_server_start_hw_py3_stat.stat.exists | bool)

- name: Count CXL devices using lspci
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      lspci 2>/dev/null | grep -i 'cxl' | wc -l
    executable: /bin/bash
  register: application_server_start_hw_cxl_raw
  changed_when: false
  failed_when: false

- name: Parse CXL device count
  ansible.builtin.set_fact:
    application_server_start_hw_cxl_cnt: "{{ application_server_start_hw_cxl_raw.stdout | default('0') | trim | int }}"

- name: Run cxl_device_info.py
  ansible.builtin.command:
    cmd: "{{ application_server_start_hw_py3 }} /usr/local/svk/feature_modules/cxl/scripts/cxl_device_info.py"
  register: application_server_start_hw_cxl
  when:
    - application_server_start_hw_py3_stat.stat.exists | bool
    - application_server_start_hw_cxl_cnt | int > 0
  changed_when: false
  failed_when: application_server_start_hw_cxl.rc != 0

- name: Start application services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  become: true
  failed_when: false
  loop:
    - cmmh_driver.service
    - cognos-node.service
    - cognos-svc-mgr.service

- name: Gather service status
  ansible.builtin.service_facts:
  changed_when: false

- name: Check service status on application server
  ansible.builtin.assert:
    that:
      - item in ansible_facts.services
      - ansible_facts.services[item].state == 'running'
    fail_msg: "{{ item }} failed to start!"
    success_msg: "{{ item }} started successfully."
  loop:
    - cmmh_driver.service
    - cognos-node.service
    - cognos-svc-mgr.service
  register: application_server_start_hw_check
  failed_when: false
  ignore_errors: true

- name: Set flag if any service failed the check
  ansible.builtin.set_fact:
    application_server_start_hw_flag: "{{ application_server_start_hw_check.results |
      selectattr('failed', 'defined') |
      selectattr('failed') |
      list | length > 0 }}"

- name: Restart all service after systemd daemon reload
  ansible.builtin.include_role:
    name: cognos_service_restart
  vars:
    cognos_service_restart_list:
      - cmmh_driver.service
      - cognos-node.service
      - cognos-svc-mgr.service
  when: application_server_start_hw_flag | default(false)

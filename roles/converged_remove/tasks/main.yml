---
- name: Check if svk_converged DEB is installed
  ansible.builtin.shell:
    cmd: "set -o pipefail && apt list --installed | grep svk-converged; echo $?"
    executable: /bin/bash
  register: converged_remove_deb_query
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Remove svk_converged packages
  ansible.builtin.apt:
    name: svk-converged
    state: absent
    purge: true
  when: converged_remove_deb_query.stdout_lines[-1] == '0' and ansible_facts['distribution'] == "Ubuntu"

- name: Uninstall converged storage dependencies[svk-core]
  ansible.builtin.include_tasks: ../../svk_core_remove/tasks/main.yml


- name: Delete log files and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ converged_remove_log_path }}"
    - "{{ converged_remove_conf_path }}"
  become: true

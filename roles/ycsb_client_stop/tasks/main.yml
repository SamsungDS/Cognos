- name: Delete GCLogLocator directory
  ansible.builtin.file:
    path: /root/ycsb_benchmarks/GCLogLocator/
    state: absent
  become: true

- name: Recreate an empty GCLogLocator directory
  ansible.builtin.file:
    path: /root/ycsb_benchmarks/GCLogLocator/
    state: directory
    mode: "0755"
  become: true

- name: Synchronize the data to disk and discard the cache
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      sync
      echo 3 > /proc/sys/vm/drop_caches
  args:
    executable: /bin/bash
  become: true
  changed_when: true

- name: Search and kill all ycsb processes
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ps aux |
      grep -i ycsb |
      grep -v grep |
      awk '{print $2}' |
      xargs -r kill -9
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  failed_when: false

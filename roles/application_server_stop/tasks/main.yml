---
- name: Stop application services
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  become: true
  loop:
    - svk-node.service
    - svk-svc-mgr.service

- name: Conduct systemd daemon-reload
  ansible.builtin.systemd:
    daemon-reload: true
  become: true

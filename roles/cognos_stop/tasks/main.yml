---
- name: Stop cognos services
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  become: true
  loop:
    - cognos-subscriber.service
    - cognos-app.service
    - cognos-rbac.service
    - cognos-ui.service

- name: Conduct systemd daemon-reload
  ansible.builtin.systemd:
    daemon-reload: true
  become: true

---
- name: Determine OS type and version
  ansible.builtin.set_fact:
    svk_cxl_install_os_family: "{{ ansible_distribution }}"
    svk_cxl_install_os_version: "{{ ansible_distribution_version }}"

- name: Set svk-cxl package name in hardware mode
  ansible.builtin.set_fact:
    svk_cxl_install_name: "svk-cxl_"
  when: not scmc_cxl_mock_enable

- name: Set svk-cxl package name in mock mode
  ansible.builtin.set_fact:
    svk_cxl_install_name: "svk-cxl-mock"
  when: scmc_cxl_mock_enable

- name: Identify svk_cxl package
  ansible.builtin.find:
    path: "{{ svk_pkg_dir }}"
    patterns: "{{ svk_cxl_install_name }}*-ubuntu{{ svk_cxl_install_os_version }}_*.deb"
  delegate_to: localhost
  run_once: true
  register: svk_cxl_install_deb
  when: svk_cxl_install_os_family == "Ubuntu"

- name: Assert svk_cxl deb found
  ansible.builtin.assert:
    that: svk_cxl_install_deb.files | length > 0
    fail_msg: "No svk-cxl deb found. Please download DEB to {{ artifacts_dir }}"

- name: Identify newest version of svk_cxl DEB found
  ansible.builtin.set_fact:
    svk_cxl_install_deb_file: "{{ (svk_cxl_install_deb.files | sort(attribute='mtime', reverse=true) | first).path }}"
  run_once: true

- name: Check if svk_cxl DEB is installed
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      apt list --installed | grep {{ svk_cxl_install_name }}
    executable: /bin/bash
  register: svk_cxl_install_deb_query
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Copy svk_cxl DEB to staging directory
  ansible.builtin.copy:
    src: "{{ svk_cxl_install_deb_file }}"
    dest: "{{ deploy_staging_dir }}"
    mode: "0644"
  when: svk_cxl_install_deb_query.rc != 0

- name: Install svk_cxl DEB
  ansible.builtin.apt:
    deb: "{{ deploy_staging_dir }}/{{ svk_cxl_install_deb_file | basename }}"
    state: present
  become: true
  when: svk_cxl_install_deb_query.rc != 0 and ansible_facts['distribution'] == "Ubuntu"

- name: Delete svk_cxl DEB from staging directory
  ansible.builtin.file:
    path: "{{ deploy_staging_dir }}/{{ svk_cxl_install_deb_file | basename }}"
    state: absent

---
- name: Get service facts
  ansible.builtin.service_facts:
  when: ansible_facts.services is not defined

- name: Stop svk-node service
  ansible.builtin.systemd:
    enabled: false
    state: stopped
    name: svk-node
  when: "'svk-node.service' in ansible_facts.services"
  become: true

- name: Stop svk-restserver service
  ansible.builtin.systemd:
    enabled: false
    state: stopped
    name: svk-restserver
  when: "'svk-restserver.service' in ansible_facts.services"
  become: true


- name: Stop svk-controller service
  ansible.builtin.systemd:
    enabled: false
    state: stopped
    name: svk-controller
  when: "'svk-controller.service' in ansible_facts.services"
  become: true

---
- name: Set svk-cxl package name in hardware mode
  ansible.builtin.set_fact:
    svk_cxl_remove_name: "svk-cxl_"
  when: not scmc_cxl_mock_enable

- name: Set svk-cxl package name in mock mode
  ansible.builtin.set_fact:
    svk_cxl_remove_name: "svk-cxl-mock"
  when: scmc_cxl_mock_enable

- name: Remove the installed svk-cxl
  ansible.builtin.apt:
    name: "{{ svk_cxl_remove_name }}"
    state: absent
    purge: true
  become: true
  when: ansible_facts['distribution'] == "Ubuntu"

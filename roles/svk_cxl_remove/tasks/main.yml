---
- name: Check if svk_cxl DEB is installed
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      apt list --installed | grep svk-cxl
    executable: /bin/bash
  register: svk_cxl_remove_deb_query
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Remove the installed svk-cxl
  ansible.builtin.apt:
    name: svk-cxl
    state: absent
    purge: true
  become: true
  when: svk_cxl_remove_deb_query.rc == 0 and ansible_facts['distribution'] == "Ubuntu"

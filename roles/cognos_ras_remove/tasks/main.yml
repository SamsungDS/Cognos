- name: Remove the installed cognos-ras on Ubuntu
  ansible.builtin.apt:
    name: cognos-ras
    state: absent
    purge: true
  become: true
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Remove the installed cognos-ras on OEL
  ansible.builtin.dnf:
    name: cognos-ras
    state: absent
  become: true
  when: ansible_facts['distribution'] == "OracleLinux"

---
- name: Stat SVK converged installation path
  ansible.builtin.stat:
    path: "{{ converged_unset_udev_bin_path }}"
  register: converged_unset_udev_path

- name: Move disks back to kernel mode (spdk reset)
  ansible.builtin.command: "{{ converged_unset_udev_bin_path }}/scripts/setup.sh reset"
  register: converged_unset_udev_reset
  changed_when: converged_unset_udev_reset.stdout is search('uio_pci_generic -> nvme')
  when: converged_unset_udev_path.stat.exists
  become: true

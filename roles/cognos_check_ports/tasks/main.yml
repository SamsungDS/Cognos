---

- name: Initialize occupied_ports list
  ansible.builtin.set_fact:
    cognos_check_ports_occupied: []
  run_once: true

- name: Check if server ports are in use using sock_state
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ss -tuln | awk '/LISTEN/ && $5 ~ /:{{ item | int }}$/ {print $5}'
    executable: /bin/bash
  register: cognos_check_ports_stat
  changed_when: false
  failed_when: false
  loop: "{{ ports | dict2items | map(attribute='value') | list }} "

- name: Append occupied ports to occupied_ports fact
  ansible.builtin.set_fact:
    cognos_check_ports_occupied: "{{ cognos_check_ports_occupied + [item.item] }}"
  when: item.stdout != ''
  loop: "{{ cognos_check_ports_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Fail the playbook if any port is already in use
  ansible.builtin.fail:
    msg: |
      The following ports are already in use. Please check the reason.
      The deployment task is terminated.
      {% for p in cognos_check_ports_occupied %}
        - {{ p }}
      {% endfor %}
  when: cognos_check_ports_occupied | length > 0

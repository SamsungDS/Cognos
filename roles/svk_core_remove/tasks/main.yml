---
- name: Check if svk_core DEB is installed
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      apt list --installed | grep svk-core
    executable: /bin/bash
  register: svk_core_remove_svk_core_deb_query
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Remove the installed svk-core
  ansible.builtin.apt:
    name: svk-core
    state: absent
    purge: true
  become: true
  when: svk_core_remove_svk_core_deb_query.rc == 0 and ansible_facts['distribution'] == "Ubuntu"

release build rocky9:
  stage: build
  image:
    name: $IMAGE_TAG
    pull_policy: always
  script:
    # Build with release flag and generate artifact
    - ./scripts/build.sh --release
  artifacts:
    name: release build
    expire_in: 300 seconds
    paths:
     - $ARTIFACTS_DIR/
  variables:
    DOCKERFILE_NAME: rocky9
    IMAGE_TAG: $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$DOCKER_BRANCH_NAME
  needs:
    - build docker
  rules:
    - !reference [.default_rules, merge_and_push]

release build ubuntu22:
  extends: release build rocky9
  variables:
    PACKAGE_MANAGER: apt-get
    CORE_PACKAGE: svk-core-dev
    DOCKERFILE_NAME: ubuntu22

release build rocky9:
  stage: build
  image:
    name: $IMAGE_TAG
    pull_policy: always
  before_script:
    # Install latest build-wrapper
    - wget --no-verbose --content-disposition -E -c "$SONAR_HOST_URL/static/cpp/build-wrapper-linux-x86.zip"
    - unzip -q build-wrapper-linux-x86.zip -d /
    # Download latest artifact from SVK Core
    - $PACKAGE_MANAGER install -y $CORE_PACKAGE
    # Export PKG_CONFIG_PATH env var
    - export PKG_CONFIG_PATH=$PKG_CONFIG_PATH:/usr/local/lib/pkgconfig/:/usr/local/lib64/pkgconfig/:/usr/local/svk/core/lib64/pkgconfig/:/usr/local/svk/core/lib/pkgconfig/
    - export PATH=$PATH:/usr/local/go/bin

  script:
    # Build with release flag and generate artifact
    - ./scripts/build.sh --release --install-prefix /usr/local/svk/mgmt-fw
  artifacts:
    name: release build
    expire_in: 300 seconds
    paths:
     - build/*.tgz
  variables:
    PACKAGE_MANAGER: microdnf
    CORE_PACKAGE: svk-core-devel
    DOCKERFILE_NAME: rocky9
    IMAGE_TAG: $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$DOCKER_BRANCH_NAME
  needs:
    - build docker
  rules:
    - !reference [.default_rules, merge_and_push]

release build ubuntu22:
  extends: release build rocky9
  variables:
    PACKAGE_MANAGER: apt-get
    CORE_PACKAGE: svk-core-dev
    DOCKERFILE_NAME: ubuntu22

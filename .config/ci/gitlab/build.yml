release build:
  stage: build
  image:
    name: $IMAGE_TAG
    pull_policy: always
  before_script:
    # Run the dependency installation script to ensure we have the latest SVK Core and SVK Management Framework package
    - ./scripts/dependencies/install.sh
  script:
    # Build with release flag and generate artifact
    - ./scripts/build.sh --release $MOCK_MODE --with-fmapi $FMAPI_PATH/build/libmbox_a1_shared.so $FMAPI_PATH -b
  artifacts:
    name: $CI_JOB_NAME - $DOCKERFILE_NAME
    expire_in: 300 seconds
    expose_as: Release Build Artifacts
    paths:
     - $ARTIFACTS_DIR/
  variables:
    MOCK_MODE:
    DOCKERFILE_NAME: rocky9
    RELEASE_TYPE: release
    FMAPI_CLONE_DIR: "$FMAPI_PROJECT/$DOCKERFILE_NAME/$RELEASE_TYPE"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$DOCKER_BRANCH_NAME
    FMAPI_PATH: $CI_PROJECT_DIR/$FMAPI_CLONE_DIR/$FMAPI_DIR
  parallel:
    matrix:
      - DOCKERFILE_NAME: rocky9
      - DOCKERFILE_NAME: ubuntu22
  needs:
    - build fmapi
  rules:
    - !reference [.default_rules, merge_and_push]

simulation build:
  extends: release build
  variables:
    MOCK_MODE: "--mock"
    RELEASE_TYPE: sim
  needs:
    - build fmapi simulation

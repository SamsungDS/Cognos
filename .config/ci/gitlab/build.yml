release build:
  stage: build
  image:
    name: $IMAGE_TAG
    pull_policy: always
  before_script:
    # Install latest build-wrapper
    - wget --no-verbose --content-disposition -E -c "$SONAR_HOST_URL/static/cpp/build-wrapper-linux-x86.zip"
    - unzip -q build-wrapper-linux-x86.zip -d /
    # Download latest artifact from SVK Core
    - microdnf install jq
    - |
      export CORE_ID=$(curl -s --header "PRIVATE-TOKEN: $CI_TOKEN" --insecure -X GET $CI_API_V4_URL/projects?search=SVK+Core | jq --raw-output '.[0].id')
    - |
      export LATEST_PACKAGE=$(curl -s --header "PRIVATE-TOKEN: $CI_TOKEN" --insecure "$CI_API_V4_URL/projects/$CORE_ID/packages?order_by=version&sort=desc")
    - export PACKAGE_ID=$(echo $LATEST_PACKAGE | jq --raw-output '.[0].id')
    - export PACKAGE_NAME=$(echo $LATEST_PACKAGE | jq --raw-output '.[0].name')
    - export PACKAGE_VERSION=$(echo $LATEST_PACKAGE | jq --raw-output '.[0].version')
    - export PACKAGE_TYPE=$(echo $LATEST_PACKAGE | jq --raw-output '.[0].package_type')
    - |
      export PACKAGE_FILENAME=$(curl -s --header "PRIVATE-TOKEN: $CI_TOKEN" --insecure "$CI_API_V4_URL/projects/$CORE_ID/packages/$PACKAGE_ID/package_files" | jq --raw-output '.[0].file_name')
    - |
      curl -s --location -O -J --header "JOB-TOKEN: $CI_JOB_TOKEN" --insecure "$CI_API_V4_URL/projects/$CORE_ID/packages/$PACKAGE_TYPE/$PACKAGE_NAME/$PACKAGE_VERSION/$PACKAGE_FILENAME"
    # Install SVK Core artifact to root
    - tar xvzf $PACKAGE_FILENAME --directory=/
    # Configure and load ldconfig
    - echo "/usr/local/svk/core/lib64" > /etc/ld.so.conf.d/svk-core-x86_64.conf
    - ldconfig
    # Load GCC Toolset 11
    - source /opt/rh/gcc-toolset-11/enable
    # Export PKG_CONFIG_PATH env var
    - export PKG_CONFIG_PATH=$PKG_CONFIG_PATH:/usr/local/lib/pkgconfig/:/usr/local/lib64/pkgconfig/:/usr/local/svk/core/lib64/pkgconfig/
  script:
    # Build with release flag and generate artifact
    - ./scripts/build.sh --release --install-prefix /usr/local/svk/mgmt-fw
  artifacts:
    name: release build
    expire_in: 300 seconds
    paths:
     - build/*.tgz
  variables:
    DOCKERFILE_NAME: rocky8
    IMAGE_TAG: $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$DOCKER_BRANCH_NAME
  needs:
    - build docker
  rules:
    - !reference [.default_rules, merge_and_push]

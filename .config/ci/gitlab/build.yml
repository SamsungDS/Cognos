release build:
  stage: build
  image:
    name: $IMAGE_TAG
    pull_policy: always
  script:
    # Build with release flag and generate artifact
    - ./scripts/build.sh --release --install-prefix /usr/local/svk
  artifacts:
    name: release build
    expire_in: 300 seconds
    paths:
     - build/*.tgz
  variables:
    DOCKERFILE_NAME: rocky8
    IMAGE_TAG: $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$DOCKER_BRANCH_NAME
  needs:
    - build docker
  rules:
    - !reference [.default_rules, merge_and_push]

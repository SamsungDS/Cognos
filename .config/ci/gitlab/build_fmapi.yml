build fmapi:
  extends: release build
  variables:
    GIT_STRATEGY: none
    CMAKE_ARGS:
  before_script:
    # configure git with CI/CD token
    - git config --global http.sslVerify false
    # install fmapi deps
    - microdnf --enablerepo=devel install jansson-devel -y
    # clone fmapi
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@$CI_SERVER_HOST/$FMAPI_GROUP/$FMAPI_PROJECT
    - cd $FMAPI_PROJECT
    - git reset --hard $FMAPI_COMMIT_ID
  script:
    - cd $FMAPI_DIR
    - mkdir build
    - cd build
    - cmake $CMAKE_ARGS ..
    - make
  artifacts:
    name: $CI_JOB_NAME
    expire_in: 300 seconds
    paths:
     - $FMAPI_PROJECT/$FMAPI_DIR
  needs:
    - build docker

build fmapi simulation:
  extends: build fmapi
  variables:
    CMAKE_ARGS: -DCMAKE_CXX_FLAGS="-DENABLE_SIM"

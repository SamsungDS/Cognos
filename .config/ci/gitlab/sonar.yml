sonar-scanner:
  stage: test
  image:
    name: $IMAGE_TAG
    pull_policy: always
  script:
      # Download sonar-scanner from SONAR_SCANNER_URL - Github-defined org var
      - export SONAR_SCANNER_FILENAME="${SONAR_SCANNER_URL##*/}"
      - wget --no-verbose --content-disposition -E -c "$SONAR_SCANNER_URL"
      # Get sonar-scanner root dir filename from printed contents of zip file
      - export SONAR_SCANNER_DIR=$(unzip -l "$SONAR_SCANNER_FILENAME" | awk '{print $4}' | grep '/' | cut -d '/' -f 1 | sort | uniq -c | sort -nr | head -n 1 | awk '{print $2}')
      - unzip -q "$SONAR_SCANNER_FILENAME" -d /
      # Execute sonar-scanner and ingest coverage report      
      - /"$SONAR_SCANNER_DIR"/bin/sonar-scanner -Dsonar.coverageReportPaths=$SONAR_COVERAGE_REPORT -Dsonar.exclusions=**/mover_damo/damo_main**
  needs:
    - job: unit test
      parallel:
        matrix:
          - DOCKERFILE_NAME: ubuntu22
  allow_failure: false
  variables:
    DOCKERFILE_NAME: ubuntu22
    IMAGE_TAG: $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$DOCKER_BRANCH_NAME
    GIT_DEPTH: 0
  rules:
    - !reference [.default_rules, merge_and_push]
    
sonar-scanner:
  extends: release build
  stage: test
  script:
    # Download sonar-scanner from URL defined in CICD variable SONAR_SCANNER_URL
    - curl --silent --remote-name $SONAR_SCANNER_URL
    - unzip -q sonar-scanner-cli-*.zip -d /
    # Execute sonar-scanner and ingest coverage report
    - /sonar-scanner-*-linux/bin/sonar-scanner -X -Dsonar.coverageReportPaths=$SONAR_COVERAGE_REPORT
  needs:
    - build docker
    - unit test
  allow_failure: false
  variables:
    GIT_DEPTH: 0

sonar-scanner:
  stage: test
  image: 
    name: sonarsource/sonar-scanner-cli:5.0.1
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script: 
    - |
      sonar-scanner \
        -Dsonar.python.coverage.reportPaths=$backend_reports_dir/coverage.xml \
        -Dsonar.javascript.lcov.reportPaths=$ui_reports_dir/lcov.info
  allow_failure: false
  needs:
    - backend unit test
    - ui unit test
  rules:
    - !reference [.default_rules, merge_and_push]

sonar-scanner:
  stage: test
  image:
    name: $IMAGE_TAG
    pull_policy: always
  before_script:
    # Download sonar-scanner from URL defined in CICD variable SONAR_SCANNER_URL
    - curl --silent --remote-name $SONAR_SCANNER_URL
    - unzip -q sonar-scanner-cli-*.zip -d /
  script:
    # Scan with sonar-scanner
    - /sonar-scanner-*-linux/bin/sonar-scanner -Dsonar.coverageReportPaths=$SONAR_COVERAGE_REPORT
  needs:
    - unit test rocky9
  allow_failure: false
  variables:
    DOCKERFILE_NAME: rocky9
    IMAGE_TAG: $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$DOCKER_BRANCH_NAME
    GIT_DEPTH: 0
  rules:
    - !reference [.default_rules, merge_and_push]

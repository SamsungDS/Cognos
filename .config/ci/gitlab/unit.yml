unit test:
  extends: release build
  stage: test
  script:
    # Install latest build-wrapper
    - wget --no-verbose --content-disposition -E -c "$SONAR_HOST_URL/static/cpp/build-wrapper-linux-x86.zip"
    - unzip -q build-wrapper-linux-x86.zip -d /
    # Build with unit tests and generate coverage report
    - /build-wrapper-linux-x86/build-wrapper-linux-x86-64 --out-dir bw-output/ $BUILD_COMMAND
  artifacts:
    name: unit test - $DOCKERFILE_NAME
    expire_in: 300 seconds
    expose_as: Unit Test Artifacts
    when: always
    paths:
     - bw-output
     - build
    reports:
      coverage_report:
        coverage_format: cobertura
        path: $GITLAB_COVERAGE_REPORT
      junit: $GITLAB_JUNIT_REPORT
  variables:
    BUILD_COMMAND: ./scripts/build.sh --build-tests --with-coverage
  parallel:
    matrix:
      # - DOCKERFILE_NAME: rocky9
      - DOCKERFILE_NAME: ubuntu22
      - DOCKERFILE_NAME: ubuntu24
  rules:
    - !reference [.default_rules, merge_and_push]
  tags:
    - svk-me

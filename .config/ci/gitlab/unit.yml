unit test:
  stage: test
  extends: release build
  script:
    - /build-wrapper-linux-x86/build-wrapper-linux-x86-64 --out-dir bw-output/ ./scripts/build.sh --build-tests --with-coverage
  after_script:
    # Copy the logs dir inside the build context so they can be collected as an artifact
    - cp -r /var/log/svk logs
  artifacts:
    name: unit test
    expire_in: 300 seconds
    expose_as: Unit Test Artifacts
    when: always
    paths:
      - logs/
      - bw-output/
      - build/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: $GITLAB_COVERAGE_REPORT
      junit: $GITLAB_JUNIT_REPORT

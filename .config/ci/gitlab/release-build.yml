release-build:
  extends: npm-build
  script:
    - ./scripts/build.sh -r
  artifacts:
    name: release build - $DOCKERFILE_NAME
    paths:
      - $ARTIFACTS_DIR/
    expire_in: 300 seconds
    expose_as: Release Build Artifacts
  variables:
    CI: false
  parallel:
    matrix:
      # - DOCKERFILE_NAME: rocky9
      - DOCKERFILE_NAME: ubuntu22
      - DOCKERFILE_NAME: ubuntu24
      - DOCKERFILE_NAME: ol10

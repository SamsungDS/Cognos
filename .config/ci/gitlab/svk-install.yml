svk-install:
  stage: deploy
  before_script:
    # Enable noninteractive installs or restart
    - export DEBIAN_FRONTEND=noninteractive
    # Install nodejs21
    - curl -fsSL https://deb.nodesource.com/setup_21.x | bash -
    - apt-get update 
    # Install SVK App dependencies and jq, moreutils for configuration file substitution
    - apt-get install jq python3-pip python3.10-venv moreutils nodejs -y
    # Install yq manually from official GitHub releases
    - wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
    - chmod +x /usr/local/bin/yq
    # Retrieve the IP of the host
    - export VM_IP=$(hostname -I | awk '{print $1}')

    #### Install Docker Engine with documentation reference: https://docs.docker.com/engine/install/ubuntu/ ####
    # Install dependencies, gpg keys and configure docker apt repository
    - apt-get install -y ca-certificates curl
    - |
      install -m 0755 -d /etc/apt/keyrings/
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
    # Install docker
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin
    # Start the docker service
    - systemctl enable --now docker || true

    #### Influx installation implemented with documentation reference: https://docs.influxdata.com/influxdb/v2/install/?t=Linux ####
    # Step 1: Download the InfluxData archive key
    - curl --silent --location -O https://repos.influxdata.com/influxdata-archive.key
    # Step 2: Convert the key to GPG format and add to trusted sources
    - cat influxdata-archive.key | gpg --dearmor | tee /etc/apt/trusted.gpg.d/influxdata-archive.gpg > /dev/null
    # Step 3: Add InfluxData repository to the apt sources list
    - echo 'deb [signed-by=/etc/apt/trusted.gpg.d/influxdata-archive.gpg] https://repos.influxdata.com/debian stable main' | tee /etc/apt/sources.list.d/influxdata.list
    - apt-get update 
    - apt-get install -y influxdb2
    - systemctl start influxdb.service
    # Influx DB command for unattended configuration
    - influx setup --username $INFLUX_ORG --password $INFLUX_PASS --org $INFLUX_ORG --bucket $INFLUX_BUCKET --retention 0 --force
    # Assign influx token to a variable, to be utilized during SVK App influx configuration
    - export INFLUX_TOKEN=$(influx auth list --user $INFLUX_ORG --json | jq -r '.[0].token')

    # Install Telegraf
    # - apt install telegraf

    # Add Caddy Repository
    - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
    - apt-get update

    #### Configure SVK Nexus repository ####
    - wget --quiet --output-document /usr/share/keyrings/ssg-nexus.pgp http://ssg-nexus.msl.lab:8081/repository/svk_common/public.pgp
    - |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ssg-nexus.pgp] http://ssg-nexus.msl.lab:8081/repository/svk_apt_ubuntu22 \
        $(. /etc/os-release && echo $UBUNTU_CODENAME) main" > /etc/apt/sources.list.d/ssg-nexus.list

  script:
    #### Install SVK ####
    # JSON replacements made with jq and sponge(provided by moreutils)
    # since jq can modify json structures but cannot replace the file in place
    - apt-get update
    # Temporary resolution
    - apt-get install svk-cxl-mock -y
    - apt-get install ./$ARTIFACTS_DIR/ubuntu22/svk-*.deb -y

    #### Configure '/etc/svk/mgmt_fw_config.json' (JSON) ####
    - export SVK_MGMT_FW_CONF='/etc/svk/mgmt_fw_config.json'
    # Substitute the feat_modules_dir in the "core" section of '/etc/svk/mgmt_fw_config.json' and replace with the path to libcxl.so
    - jq '.core.feat_modules_dir = "/usr/local/svk/feature_modules"' $SVK_MGMT_FW_CONF | sponge $SVK_MGMT_FW_CONF
    # Modify the node_id variable in the '/etc/svk/mgmt_fw_config.json'
    - jq --arg hn "$(hostname)" '.svk_mgmt_fw_node.node.name=$hn' $SVK_MGMT_FW_CONF | sponge $SVK_MGMT_FW_CONF
    - jq --arg ip "$VM_IP" '.svk_mgmt_fw_node.node.id=$ip' $SVK_MGMT_FW_CONF | sponge $SVK_MGMT_FW_CONF
    # Substitute the svc.mgr.feat_sm_svcs_dir in the "svk_mgmt_fw" section of '/etc/svk/mgmt_fw_config.json' and
    # replace with the path to libcxl.so
    - jq '.svk_mgmt_fw_svc_mgr.svc_mgr.feat_sm_svcs_dir = "/usr/local/svk/feature_modules"' $SVK_MGMT_FW_CONF | sponge $SVK_MGMT_FW_CONF
    - jq --arg ip "$VM_IP" '.svk_mgmt_rest_api.rest_server.id = $ip' $SVK_MGMT_FW_CONF | sponge $SVK_MGMT_FW_CONF
    #### Configure '/etc/svk/zmq_config.json' ####
    - export SVK_ZMQ_CONF='/etc/svk/zmq_config.json'
    # Substitute IP of the host in the configuration file to ensure publisher and subscriber listen to the same IP
    - jq --arg ip "$VM_IP" '.svk_cxl_host_node.ip = $ip' $SVK_ZMQ_CONF | sponge $SVK_ZMQ_CONF

    #### Management FW input.json configuration (JSON) ####
    - export SVK_MGMT_FW_INPUT='/usr/local/svk/mgmt-fw/input.json'
    # (SIM mode) Configure the input.json file to reflect the hostname of the machine being deployed
    - jq --arg hn "$(hostname)" '.Hosts[0].host_name=$hn' $SVK_MGMT_FW_INPUT | sponge $SVK_MGMT_FW_INPUT

    #### Influx SVK App configuration (JSON) ####
    - export SVK_APP_INFLUX_CONF='/usr/local/svk/svk-app/cognos/backend/config/influxdb_config.json'
    # Influx bucket variable reused from gitlab-ci.yml, to substitute the bucket value
    - jq --arg bucket "$INFLUX_BUCKET" '.bucket = $bucket' $SVK_APP_INFLUX_CONF | sponge $SVK_APP_INFLUX_CONF
    # Influx URL variable reused from gitlab-ci.yml, to substitute the URL value
    - jq --arg url "http://localhost:8086" '.url = $url' $SVK_APP_INFLUX_CONF | sponge $SVK_APP_INFLUX_CONF
    # Influx token variable generated from before_script section, to substitute the token value
    - jq --arg token "$INFLUX_TOKEN" '.token = $token' $SVK_APP_INFLUX_CONF | sponge $SVK_APP_INFLUX_CONF
    # Influx org variable reused from gitlab-ci.yml, to substitute the org value
    - jq --arg org "$INFLUX_ORG" '.org = $org' $SVK_APP_INFLUX_CONF | sponge $SVK_APP_INFLUX_CONF
    
    #### Telegraf configuration
    # - sudo sed -i -E 's|^[[:space:]]*token[[:space:]]*=.*|    token = "'"$INFLUX_TOKEN"'"|' /usr/local/svk/svk-app/cognos/telegraf/telegraf.conf
    - jq --arg ip "$VM_IP" --arg restport "$RESTSERVER_PORT" '.cognos_endpoint = "http://\($ip):\($restport)/api/v1/"' /usr/local/svk/svk-app/cognos/telegraf/config/config.json | sponge /usr/local/svk/svk-app/cognos/telegraf/config/config.json
    - jq --arg token "$INFLUX_TOKEN" '.token = $token' /usr/local/svk/svk-app/cognos/telegraf/config/config.json | sponge /usr/local/svk/svk-app/cognos/telegraf/config/config.json

    #### Configure nodes, pids, and numa nodes for backend
    - jq --arg hn "$(hostname)" '.[$hn]=.["<host1>"] | del(.["<host1>"])' /usr/local/svk/svk-app/cognos/backend/config/numa_config.json | sponge /usr/local/svk/svk-app/cognos/backend/config/numa_config.json

    #### SVK APP Backend configuration (JSON) ####
    - export SVK_APP_BACKEND_CONF='/usr/local/svk/svk-app/cognos/backend/config/config.json'
    # Set 'cognos_endpoint' parameter to point to Cognos Northbound API
    - jq --arg ip "$VM_IP" --arg restport "$RESTSERVER_PORT" '.cognos_endpoint = "http://\($ip):\($restport)/api/v1/"' $SVK_APP_BACKEND_CONF | sponge $SVK_APP_BACKEND_CONF
    # Substitute '.mysql_db_dev_passwd' value with MYSQL_DEV_PASSWORD obtained from gitlab-ci.yml
    - jq --arg passwd "$MYSQL_DEV_PASSWORD" '.mysql_db_dev_passwd =  $passwd' $SVK_APP_BACKEND_CONF | sponge $SVK_APP_BACKEND_CONF
    # Substitute '.agent_endpoint' value with RESTSERVER_PORT obtained from gitlab-ci.yml
    - jq --arg ip "$VM_IP" --arg restport "$RESTSERVER_PORT" '.agent_endpoint = "http://\($ip):\($restport)/api/v1/process_controller_command"' $SVK_APP_BACKEND_CONF | sponge $SVK_APP_BACKEND_CONF
    # Substitute '.node_endpoint' value with NODE_PORT obtained from gitlab-ci.yml
    - jq --arg ip "$VM_IP" --arg nodeport "$NODE_PORT" '.node_endpoint = "\($ip):\($nodeport)"' $SVK_APP_BACKEND_CONF | sponge $SVK_APP_BACKEND_CONF
    # Substitute 'list_cluster_ep' value with RESTSERVER_PORT obtained from gitlab-ci.yml
    - jq --arg ip "$VM_IP" --arg restport "$RESTSERVER_PORT" '.list_cluster_ep = "http://\($ip):\($restport)/api/v1/list_cluster_nodes"' $SVK_APP_BACKEND_CONF | sponge $SVK_APP_BACKEND_CONF

    #### SVK App subscriber configuration (JSON) ####
    - export SVK_APP_SUBSCRIBER_CONF='/usr/local/svk/svk-app/cognos/subscriber/sub_config.json'
    # Substitute the '.rest_ip' endpoint in SVK_APP_SUBSCRIBER_CONF
    - jq --arg ip "$VM_IP" '.rest_ip = $ip' $SVK_APP_SUBSCRIBER_CONF | sponge $SVK_APP_SUBSCRIBER_CONF
    # Substitute '.publisher_topic' value with the term "metric"
    - jq '.publisher_topic = "metric"' $SVK_APP_SUBSCRIBER_CONF | sponge $SVK_APP_SUBSCRIBER_CONF

    #### RBAC configuration (YAML) ####
    - export SVK_APP_RBAC_YAML='/usr/local/svk/svk-app/cognos/rbac/core/etc/rbac.yaml'
    # Substitute '.database' value with MONGODB_PORT value in SVK_APP_RBAC_YAML obtained from gitlab-ci.yml
    - yq eval --inplace ".database.uri = \"mongodb://admin:admin@${VM_IP}:${MONGODB_PORT}\""  "$SVK_APP_RBAC_YAML"
    # Substitute '.frontend' value with RBAC_UI_PORT value in SVK_APP_RBAC_YAML obtained from gitlab-ci.yml
    - yq eval --inplace ".frontend.url = \"http://${VM_IP}:${RBAC_UI_PORT}\"" "$SVK_APP_RBAC_YAML"
    # Substitute '.backend' value with RBAC_BACKEND_PORT value in SVK_APP_RBAC_YAML obtained from gitlab-ci.yml
    - yq eval --inplace ".backend.url = \"http://${VM_IP}:${RBAC_BACKEND_PORT}\"" "$SVK_APP_RBAC_YAML"

    #### RBAC docker-config.env configuration ####
    - export SVK_APP_RBAC_ENV='/usr/local/svk/svk-app/cognos/rbac/docker-config.env'

    # Substitute FRONTEND_PORT
    - sed -i "s|^FRONTEND_PORT=.*|FRONTEND_PORT=${RBAC_UI_PORT}|" "$SVK_APP_RBAC_ENV"

    # Substitute BACKEND_PORT
    - sed -i "s|^BACKEND_PORT=.*|BACKEND_PORT=${RBAC_BACKEND_PORT}|" "$SVK_APP_RBAC_ENV"

    # Substitute MONGODB_URI
    - sed -i "s|^MONGODB_URI=.*|MONGODB_URI=mongodb://admin:admin@${VM_IP}:${MONGODB_PORT}|" "$SVK_APP_RBAC_ENV"

    # Substitute SUPER_ADMIN credentials from GitLab variables
    - sed -i "s|^SUPER_ADMIN_USERNAME=.*|SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME}|" "$SVK_APP_RBAC_ENV"
    - sed -i "s|^SUPER_ADMIN_EMAIL=.*|SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}|" "$SVK_APP_RBAC_ENV"
    - sed -i "s|^SUPER_ADMIN_PASSWORD=.*|SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}|" "$SVK_APP_RBAC_ENV"
    # Substitute BACKEND_URL based on SSL_ENABLED
    - sed -i "s|^SSL_ENABLED=.*|SSL_ENABLED=${SSL_ENABLED}|" "$SVK_APP_RBAC_ENV"
    - |
      if [ "${SSL_ENABLED}" = "true" ]; then
        PROTOCOL="https"
      else
        PROTOCOL="http"
      fi
      sed -i "s|^BACKEND_URL=.*|BACKEND_URL=${PROTOCOL}://${VM_IP}:${RBAC_BACKEND_PORT}|" "$SVK_APP_RBAC_ENV"

    #### SVK App UI configuration (JSON) ####
    - export SVK_APP_UI_CONF='/usr/local/svk/svk-app/cognos/ui/src/config/config.json'
    # Substitute '.rbac_endpoint' value with RBAC_UI_PORT value in SVK_APP_UI_CONF obtained from gitlab-ci.yml
    - jq --arg ip "$VM_IP" --arg rbac_ui_port "$RBAC_UI_PORT" '.rbac_endpoint= "http://\($ip):\($rbac_ui_port)"' $SVK_APP_UI_CONF | sponge $SVK_APP_UI_CONF
    # Substitute '.mgmt_endpoint' value with UI_PORT value in SVK_APP_UI_CONF obtained from gitlab-ci.yml
    - jq --arg ip "$VM_IP" --arg ui_port "$UI_PORT" '.mgmt_endpoint = "http://\($ip):\($ui_port)"' $SVK_APP_UI_CONF | sponge $SVK_APP_UI_CONF
    # Substitute '.data_endpoint' value with BACKEND_PORT value in SVK_APP_UI_CONF obtained from gitlab-ci.yml
    - jq --arg ip "$VM_IP" --arg backend_port "$BACKEND_PORT" '.data_endpoint = "http://\($ip):\($backend_port)"' $SVK_APP_UI_CONF| sponge $SVK_APP_UI_CONF
    # Substitute '.api_endpoint' value with BACKEND_PORT value in SVK_APP_UI_CONF obtained from gitlab-ci.yml
    - jq --arg ip "$VM_IP" --arg backend_port "$BACKEND_PORT" '.api_endpoint = "http://\($ip):\($backend_port)/api/v2.0.1"' $SVK_APP_UI_CONF | sponge $SVK_APP_UI_CONF

    #### Cognos.config configuration changes ####
    # Step 1: Set MODE to 'real' to populate metrics using service manager
    - sed -i 's|^MODE=.*|MODE="real"|' "$SVK_DIR/svk-app/cognos.config"
    # Step 2: Set CAL_PORT to pass information to the backend
    - sed -i "s|^CAL_PORT.*|CAL_PORT=${BACKEND_PORT}|" "$SVK_DIR/svk-app/cognos.config"
    # Step 3: Set SUB_PORT to publish metrics to the subscriber
    #- sed -i "s|^SUB_PORT=.*|SUB_PORT=${SUB_PORT}|" "$SVK_DIR/svk-app/cognos.config"
    # Step 4: Set CAL_IP to indicate the host running the backend
    - sed -i "s|^CAL_IP=.*|CAL_IP=${VM_IP}|" "$SVK_DIR/svk-app/cognos.config"
    # Step 5: Set SUB_HOST to indicate the host running the subscriber
    #- sed -i "s|^SUB_HOST=.*|SUB_HOST=${VM_IP}|" "$SVK_DIR/svk-app/cognos.config"

    # Start the Management FW services
    - systemctl start svk-controller.service
    - systemctl start svk-restserver.service
    - systemctl start svk-node.service
    # Temporary resolution
    - sleep 10
    - systemctl start svk-svc-mgr
    # Start the SCMC UI services
    - systemctl start cognos-subscriber
    - systemctl start cognos-app
    - systemctl start cognos-rbac
    # - telegraf --config /usr/local/svk/svk-app/cognos/telegraf/telegraf.conf > /var/log/telegraf.log 2>&1 &
    - cd /usr/local/svk/svk-app/cognos/telegraf/
    - nohup /usr/local/svk/svk-app/env/bin/python3 poll.py > /dev/null 2>&1 &
    - systemctl start cognos-ui
    #### Create Admin User ####
    - systemctl status cognos-rbac.service --no-pager
    - sleep 30
    
    #### Create Admin User Automatically ####
    - echo "Waiting for cognos-rbac service to be ready..."
    - systemctl status cognos-rbac.service --no-pager
    - export API_BASE_URL="http://${VM_IP}:${RBAC_BACKEND_PORT}/api"
    - echo "Checking RBAC API availability at ${API_BASE_URL}..."
    - echo "Note RBAC service typically takes 87+ seconds to start..."
    - export MAX_RETRIES=40
    - export RETRY_COUNT=0
    - export WAIT_TIME=5
    - |
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${API_BASE_URL}/login" -H "Content-Type: application/json" -d '{"username":"test","password":"test"}' 2>/dev/null || echo "000")
        # Check if we got a valid 3-digit HTTP code (200-599)
        if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 600 ] 2>/dev/null; then
          ELAPSED_TIME=$((RETRY_COUNT * WAIT_TIME))
          echo "✓ RBAC API is responding (HTTP $HTTP_CODE) after ${ELAPSED_TIME} seconds"
          break
        fi
        RETRY_COUNT=$((RETRY_COUNT + 1))
        ELAPSED_TIME=$((RETRY_COUNT * WAIT_TIME))
        echo "Attempt $RETRY_COUNT/$MAX_RETRIES (${ELAPSED_TIME}s elapsed): Got HTTP ${HTTP_CODE}, waiting ${WAIT_TIME} seconds..."
        sleep $WAIT_TIME
      done
      if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
        TOTAL_WAIT=$((MAX_RETRIES * WAIT_TIME))
        echo "ERROR: RBAC API did not become available after ${TOTAL_WAIT} seconds"
        echo ""
        echo "=== RBAC Service Logs (last 100 lines) ==="
        journalctl -u cognos-rbac.service -n 100 --no-pager || true
        echo ""
        echo "=== Port Listening Check ==="
        netstat -tlnp | grep ${RBAC_BACKEND_PORT} || ss -tlnp | grep ${RBAC_BACKEND_PORT} || echo "Port ${RBAC_BACKEND_PORT} not listening"
        echo ""
        echo "=== Docker Container Status ==="
        docker ps -a | grep rbac || echo "No RBAC containers found"
        echo ""
        echo "=== Direct curl test ==="
        curl -v "http://localhost:${RBAC_BACKEND_PORT}/api/login" 2>&1 || true
        exit 1
      fi
    - |
      if [ -n "$NEW_ADMIN_USERNAME" ]; then
        set +e
        echo "================================================"
        echo "Creating and approving new admin user"
        echo "================================================"
        echo "API Base URL: ${API_BASE_URL}"
        echo "New user: ${NEW_ADMIN_USERNAME} (${NEW_ADMIN_EMAIL})"
        echo ""
        echo "[Step 1/4] Creating user: ${NEW_ADMIN_USERNAME}"
        SIGNUP_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "${API_BASE_URL}/signup" -H "Content-Type: application/json" -d "{\"username\":\"${NEW_ADMIN_USERNAME}\",\"email\":\"${NEW_ADMIN_EMAIL}\",\"password\":\"${NEW_ADMIN_PASSWORD}\",\"role\":\"${NEW_ADMIN_ROLE:-admin}\"}")
        HTTP_CODE=$(echo "$SIGNUP_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
        SIGNUP_BODY=$(echo "$SIGNUP_RESPONSE" | sed '/HTTP_CODE:/d')
        echo "HTTP Status: $HTTP_CODE"
        echo "Response: $SIGNUP_BODY"
        if echo "$SIGNUP_BODY" | grep -qi "already exists"; then
          echo "Warning: User already exists, continuing with approval..."
        elif echo "$SIGNUP_BODY" | grep -qi "Internal server error"; then
          echo "Note: Got expected 'Internal server error' - user should be created"
        fi
        sleep 3
        echo ""
        echo "[Step 2/4] Logging in as super admin..."
        LOGIN_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "${API_BASE_URL}/login" -H "Content-Type: application/json" -d "{\"username\":\"${SUPER_ADMIN_USERNAME}\",\"password\":\"${SUPER_ADMIN_PASSWORD}\"}")
        HTTP_CODE=$(echo "$LOGIN_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
        LOGIN_BODY=$(echo "$LOGIN_RESPONSE" | sed '/HTTP_CODE:/d')
        echo "HTTP Status: $HTTP_CODE"
        TOKEN=$(echo "$LOGIN_BODY" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
        if [ -z "$TOKEN" ]; then
          echo "ERROR: Failed to get authentication token"
          echo "Login response: $LOGIN_BODY"
          echo "Please check SUPER_ADMIN credentials and RBAC service status"
          set -e
          exit 1
        fi
        echo "✓ Authentication successful"
        echo ""
        echo "[Step 3/4] Fetching user ID..."
        USER_LIST=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X GET "${API_BASE_URL}/all-users" -H "Content-Type: application/json" -H "Authorization: Bearer ${TOKEN}")
        HTTP_CODE=$(echo "$USER_LIST" | grep "HTTP_CODE:" | cut -d: -f2)
        USER_LIST_BODY=$(echo "$USER_LIST" | sed '/HTTP_CODE:/d')
        echo "HTTP Status: $HTTP_CODE"
        USER_ID=$(echo "$USER_LIST_BODY" | grep -o "\"id\":\"[^\"]*\"[^}]*\"username\":\"${NEW_ADMIN_USERNAME}\"" | grep -o "\"id\":\"[^\"]*" | cut -d'"' -f4)
        if [ -z "$USER_ID" ]; then
          echo "ERROR: Could not find user ID for: ${NEW_ADMIN_USERNAME}"
          echo "User list response (first 1000 chars):"
          echo "$USER_LIST_BODY" | head -c 1000
          set -e
          exit 1
        fi
        echo "✓ Found user ID: $USER_ID"
        echo ""
        echo "[Step 4/4] Approving user..."
        APPROVAL_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "${API_BASE_URL}/update-user-approval" -H "Content-Type: application/json" -H "Authorization: Bearer ${TOKEN}" -d "{\"userId\":\"${USER_ID}\",\"action\":\"approve\"}")
        HTTP_CODE=$(echo "$APPROVAL_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
        APPROVAL_BODY=$(echo "$APPROVAL_RESPONSE" | sed '/HTTP_CODE:/d')
        echo "HTTP Status: $HTTP_CODE"
        echo "Response: $APPROVAL_BODY"
        if echo "$APPROVAL_BODY" | grep -q "approved successfully"; then
          echo ""
          echo "================================================"
          echo "✓ SUCCESS: User ${NEW_ADMIN_USERNAME} created and approved!"
          echo "================================================"
          set -e
        else
          echo ""
          echo "================================================"
          echo "✗ ERROR: User approval failed"
          echo "================================================"
          echo "Full response: $APPROVAL_BODY"
          set -e
          exit 1
        fi
      else
        echo "Skipping new admin user creation (NEW_ADMIN_USERNAME not provided)"
      fi

    #### SVK installation complete ####
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: stage-release-artifacts
    - restore vmware snapshot
  tags:
    - svk-dev


pycodestyle:
  stage: lint
  image: alpine:3.19.1
  before_script:
    - apk add py3-pycodestyle
  script:
    - pycodestyle $PYCODESTYLE_PATH --show-source --show-pep8
  variables:
    PYCODESTYLE_PATH: cognos/backend
  allow_failure: false
  rules:
    - !reference [.default_rules, merge_and_push]

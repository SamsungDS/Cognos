include:
  - .config/ci/gitlab/build.yml
  - .config/ci/gitlab/publish.yml
  - .config/ci/gitlab/unit.yml
  - .config/ci/gitlab/sonar.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/defaults.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/tag_version.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/shellcheck.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/coverage.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/clang-format.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/docker.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/doxygen.yml

variables:
  REPORT_DIR: build/reports
  SONAR_COVERAGE_REPORT: $REPORT_DIR/sonar_coverage.xml
  GITLAB_COVERAGE_REPORT: $REPORT_DIR/gitlab_coverage.xml
  GITLAB_JUNIT_REPORT: $REPORT_DIR/gitlab_junit.xml

tag semantic version:
  stage: pre-build

build docker:
  stage: pre-build

clang-format:
  stage: test

shellcheck:
  stage: test

pages:
  stage: post-build

code coverage:
  stage: post-build
  needs:
    - sonar-scanner

include:
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/defaults.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/docker.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/shellcheck.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/tag_version.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/coverage.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/pycodestyle.yml
  - .config/ci/gitlab/npm-build.yml
  - .config/ci/gitlab/integration.yml
  - .config/ci/gitlab/unit-backend.yml
  - .config/ci/gitlab/unit-ui.yml
  - .config/ci/gitlab/sonar.yml

variables:
  ui_dir: cognos/ui
  ui_reports_dir: $ui_dir/coverage
  backend_reports_dir: scripts/test-reports/ut

# Stage name overrides
build docker:
  stage: .pre
  variables:
    DOCKERFILE_NAME: rocky9

get branch:
  stage: .pre

tag semantic version:
  stage: .pre

shellcheck:
  stage: test

code coverage:
  stage: .post

pycodestyle:
  stage: test
  needs: []

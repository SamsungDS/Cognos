include:
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/defaults.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/tag_version.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/shellcheck.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/coverage.yml
  - .config/ci/gitlab/docker.yml
  - .config/ci/gitlab/build.yml
  - .config/ci/gitlab/sonar.yml
  - .config/ci/gitlab/doxygen.yml

.build:
  matrix:
    - DOCKERFILE_NAME:
      - rocky8
      - rocky9

build docker:
  parallel:
    matrix: !reference [.build, matrix]

build:
  parallel:
    matrix: !reference [.build, matrix]

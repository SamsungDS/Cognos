ui unit test:
  extends: .ui_npm_cache
  stage: test
  image:
    name: $IMAGE_TAG
    pull_policy: always
  before_script:
    # Install NPM modules (hydrates from cache when package-lock.json is unchanged)
    - cd $TEST_DIR
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    # Execute unit tests and generate coverage report
    - npm run test:coverage
  artifacts:
    name: $CI_JOB_NAME
    expire_in: 300 seconds
    paths:
     - $ui_reports_dir/lcov.info
    reports:
      coverage_report:
        coverage_format: cobertura
        path: $ui_reports_dir/cobertura-coverage.xml
      junit: $TEST_DIR/junit.xml
  variables:
    TEST_DIR: "$ui_dir"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$DOCKER_BRANCH_NAME
  parallel:
    matrix:
      - DOCKERFILE_NAME: ubuntu22
      - DOCKERFILE_NAME: ubuntu24
      - DOCKERFILE_NAME: ol10
  rules:
    - !reference [.default_rules, merge_and_push]
  needs: []

rbac unit test:
  extends: ui unit test
  cache:
    - key:
        files:
          - cognos/rbac/core/bin/rbac-client-repo/package-lock.json
        prefix: rbac
      paths:
        - cognos/rbac/core/bin/rbac-client-repo/node_modules
        - .npm
      policy: pull-push
  variables:
    TEST_DIR: "$rbac_dir"
    ui_reports_dir: "$rbac_client_reports_dir"
  needs: []

ui unit test:
  stage: test
  image:
    name: $IMAGE_TAG
    pull_policy: always
  before_script:
    # Install NPM modules
    - cd $TEST_DIR
    - npm ci
  script:
    # Execute unit tests and generate coverage report
    - npm run test:coverage
  artifacts:
    name: $CI_JOB_NAME
    expire_in: 300 seconds
    paths:
     - $ui_reports_dir/lcov.info
    reports:
      coverage_report:
        coverage_format: cobertura
        path: $ui_reports_dir/cobertura-coverage.xml
      junit: $TEST_DIR/junit.xml
  variables:
    DOCKERFILE_NAME: rocky9
    TEST_DIR: "$ui_dir"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$DOCKER_BRANCH_NAME
  rules:
    - !reference [.default_rules, merge_and_push]
  needs:
    - npm-build

rbac unit test:
  extends: ui unit test
  variables:
    TEST_DIR: "$rbac_dir"
    ui_reports_dir: "$rbac_client_reports_dir"
    
ansible-deploy:
  stage: deploy
  image:
    name: $IMAGE_TAG
    pull_policy: always
  parallel:
    matrix:
      - DOCKERFILE_NAME: ubuntu22
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$CI_KEY" | tr -d '\r' > ~/.ssh/svk-ci-deploy
    - chmod 600 ~/.ssh/svk-ci-deploy
    - ansible-galaxy collection install -r collections/requirements.yml
    - OS_TARGET=$(ssh -i ~/.ssh/svk-ci-deploy -o StrictHostKeyChecking=no root@$VM_NAME.msl.lab
        "source /etc/os-release;
        if [[ \$ID == ubuntu ]]; then echo ubuntu\${VERSION_ID//./};
        elif [[ \$ID == ol ]]; then echo ol\${VERSION_ID%%.*};
        else echo unknown; fi")
    - echo "Detected OS target:$OS_TARGET"
    - bash scripts/release.sh --os "$OS_TARGET" --mock
    - sed -i -e "s/hostname[0-9]\/host_ip[0-9]/$VM_NAME.msl.lab/g" -e "s/<user name>/root/" hosts
    - 'echo "$ANSIBLE_VAULT_PASSWORD" > "$CI_PROJECT_DIR/.vault_pass"'
    - 'echo "vault_ansible_password: $ANSIBLE_VAULT_PASSWORD" > group_vars/all/passwords.yml'
    - 'ansible-vault encrypt group_vars/all/passwords.yml --vault-password-file "$CI_PROJECT_DIR/.vault_pass"'
  script:
    - ansible-playbook -i hosts playbooks/deploy_cognos.yml
        --private-key ~/.ssh/svk-ci-deploy
        -e scmc_cxl_mock_enable=true
        -e application_server_type=CMMH
        -e cognos_install_gui_enabled=true
        --vault-password-file "$CI_PROJECT_DIR/.vault_pass"
  after_script:
    - rm -rf group_vars/all/passwords.yml
  variables:
    ANSIBLE_HOST_KEY_CHECKING: "False"
    ANSIBLE_FORCE_COLOR: "true"
    ANSIBLE_CONFIG: ansible.cfg
    DOCKERFILE_NAME: ubuntu22
    IMAGE_TAG: $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$DOCKER_BRANCH_NAME
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"

### Playbook Documentation ###
#
# #### playbooks/deploy_cognos_converged.yml
#
# Execute this playbook to deploy Cognos converged storage software to converged_node in your inventory.
# This playbook will perform the following:
# Check hardware and software environment that required by converged storage on all [converged_node].
# Install converged storage software on all [converged_node]
#

- name: Validate ansible versions and dependencies
  hosts: localhost
  roles:
    - validate_ansible

- name: Check prerequirement for converged node install
  hosts: converged_node
  roles:
    - converged_check_deps

- name: Check svk_converged install
  hosts: converged_node
  roles:
    - converged_install

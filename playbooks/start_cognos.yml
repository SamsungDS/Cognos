---
- name: Ensure backend ports are open on the management server
  hosts: management_server
  become: true
  vars:
    ports: "{{ mgmt_ports_backend }}"
  roles:
    - cognos_allow_ports

- name: Ensure frontend ports are open on the management server
  hosts: management_server
  become: true
  vars:
    ports: "{{ mgmt_ports_frontend}}"
  roles:
    - role: cognos_allow_ports
      when: cognos_install_gui_enabled

- name: Ensure ports are open on the application server
  hosts: application_server
  become: true
  vars:
    ports: "{{ app_ports }}"
  roles:
    - cognos_allow_ports

- name: Get IP of application_server from role
  hosts:
    - application_server
    - management_server
  gather_facts: true

- name: Start Management Server with mock devices
  hosts:
    - management_server
  roles:
    - role: "management_server_start_mock"
      when: scmc_cxl_mock_enable

- name: Start Management Server in hardware mode
  hosts:
    - management_server
  roles:
    - role: management_server_start_hw
      when: not scmc_cxl_mock_enable

- name: Start Application Server with mock devices
  hosts:
    - application_server
  roles:
    - role: "application_server_start_mock"
      when: scmc_cxl_mock_enable

- name: Start Application Server in hardware mode
  hosts:
    - application_server
  roles:
    - role: application_server_start_hw
      when: not scmc_cxl_mock_enable

- name: Start Cognos services
  hosts:
    - management_server
  roles:
    - role: cognos_start
      when: cognos_install_gui_enabled

- name: Ensure ports are open for cognos rbac
  hosts: management_server
  become: true
  vars:
    ports: "{{ rbac_ports }}"
  roles:
    - role: cognos_allow_ports
      when:
        - cognos_install_gui_enabled
        - cognos_rbac_enabled

- name: Start Cognos rbac services
  hosts:
    - management_server
  roles:
    - role: cognos_rbac_start
      when:
        - cognos_install_gui_enabled
        - cognos_rbac_enabled

---
- name: Stop Management Server
  hosts:
    - management_server
  roles:
    - role: management_server_stop_mock
      when: scmc_cxl_mock_enable

- name: Stop Management Server with direct attached devices
  hosts:
    - management_server
  roles:
    - role: management_server_stop_hw
      when: not scmc_cxl_mock_enable

- name: Stop Application Server
  hosts:
    - application_server
  roles:
    - application_server_stop

- name: Stop Cognos services
  hosts:
    - management_server
  roles:
    - cognos_stop

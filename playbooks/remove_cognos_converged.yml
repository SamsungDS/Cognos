### Playbook Documentation ###
#
# #### playbooks/remove_cognos_converged.yml
#
# Execute this playbook to deploy Cognos converged storage software to converged_node in your inventory.
# This playbook will perform the following:
# * Uninstall converged storage on all [converged_node]
# * Remove configuration file and log file of converged storage on all [converged_node]
# * Move NVMe devices to kernel mode
#

- name: Move NVMe devices to kernel space mode
  hosts: converged_node
  roles:
    - converged_unset_udev


- name: Uninstall converged storage
  hosts: converged_node
  roles:
    - converged_remove

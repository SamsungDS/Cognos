### Playbook Documentation ###
#
# #### playbooks/deploy_cognos_slat.yml
#
# Execute this playbook to deploy Cognos SLA Tracker software to slat_node in your inventory.
# This playbook will perform the following:
# * Check hardware and software environment that required by SLA Tracker on all [slat_node]
# * Install SLA Tracker software on all [slat_node]
#

- name: Validate ansible versions and dependencies
  hosts: localhost
  roles:
    - validate_ansible

- name: Check dependecies of SLA Tracker node
  hosts: slat_node
  roles:
    - slat_check_deps

- name: Install SLA Tracker related packages
  hosts: slat_node
  roles:
    - slat_install

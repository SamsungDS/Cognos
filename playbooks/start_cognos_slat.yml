### Playbook Documentation ###
#
# #### playbooks/start_cognos_converged.yml
#
# Execute this playbook to start cognos SLA Tracker services.
# This playbook will perform the following:
#
# *  configure, and enable and start SLA tracker service on all [slat_node]
#

- name: Configure SLA Tracker service
  hosts: slat_node
  roles:
    - slat_configure

- name: Start SLA Tracker service
  hosts: slat_node
  roles:
    - slat_start

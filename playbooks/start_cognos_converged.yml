### Playbook Documentation ###
#
# #### playbooks/start_cognos_converged.yml
#
# Execute this playbook to start cognos converged storage services.
# This playbook will perform the following:
#
# *  configure, and enable and start converged storage service on all [converged_node]
#

- name: Config SVK converged storage service
  hosts: converged_node
  roles:
    - converged_config

- name: Start SVK converged storage service
  hosts: converged_node
  roles:
    - converged_start

### Playbook Documentation ###
#
# #### playbooks/remove_cognos_slat.yml
#
# Execute this playbook to deploy SLA Tracker software to slat_node in your inventory.
# This playbook will perform the following:
# * Uninstall SLAT on all [slat_node]
# * Remove configuration file and log file of SLAT on all [slat_node]
#


- name: Uninstall SLA Tracker
  hosts: slat_node
  roles:
    - slat_remove

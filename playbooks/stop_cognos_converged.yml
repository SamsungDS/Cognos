### Playbook Documentation ###
#
# #### playbooks/stop_cognos_converged.yml
#
# Execute this playbook to stop cognos converged storage services.
# This playbook will perform the following:
#
# *  Stop and disable converged storage service on all [converged_node]
#
- name: Stop SVK converged storage service
  hosts: converged_node
  roles:
    - converged_stop

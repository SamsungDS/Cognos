---
- name: Ensure ports are open on the management server
  hosts: management_server
  become: true
  vars:
    ports: "{{ mgmt_ports_frontend }}"
  roles:
    - cognos_allow_ports

- name: Get IP of application_server from role
  hosts:
    - application_server
    - management_server
  gather_facts: true

- name: Start Cognos services
  hosts:
    - management_server
  roles:
    - cognos_start

- name: Ensure rbac ports are open on the management server
  hosts: management_server
  become: true
  vars:
    ports: "{{ rbac_ports }}"
  roles:
    - role: cognos_allow_ports
      when: cognos_rbac_enabled

- name: Start Cognos rbac services
  hosts:
    - management_server
  roles:
    - role: cognos_rbac_start
      when: cognos_rbac_enabled

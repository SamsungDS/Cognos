---
- name: Install required packages for management server
  hosts:
    - management_server
  roles:
    - management_server_deps

- name: Install svk core
  hosts:
    - management_server
    - application_server
  roles:
    - svk_core_install

- name: Install svk mgmt-fw
  hosts:
    - management_server
    - application_server
  roles:
    - svk_mgmt_fw_install

- name: Install svk-cxl
  hosts:
    - management_server
    - application_server
  roles:
    - role: svk_cxl_install

- name: Install svk-slat
  hosts:
    - management_server
    - application_server
  roles:
    - svk_slat_install

- name: Install svk_node
  hosts:
    - management_server
    - application_server
  roles:
    - role: svk_node_install

- name: Install svk_me
  hosts:
    - management_server
    - application_server
  roles:
    - role: svk_me_install

- name: Install svk_ras
  hosts:
    - management_server
    - application_server
  roles:
    - role: svk_ras_install

- name: Install svk app framework
  hosts:
    - management_server
  roles:
    - svk_app_install

- name: Start SCMC
  ansible.builtin.import_playbook: start_scmc.yml

include:
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/defaults.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/docker.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/shellcheck.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/tag_version.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/coverage.yml
  - project: dfs/svk/tools
    ref: main
    file: .config/ci/gitlab/pycodestyle.yml
  - .config/ci/gitlab/npm-build.yml
  - .config/ci/gitlab/unit-backend.yml
  - .config/ci/gitlab/unit-ui.yml
  - .config/ci/gitlab/sonar.yml
  - .config/ci/gitlab/release-build.yml
  - .config/ci/gitlab/stage-release-artifacts.yml
  - .config/ci/gitlab/publish.yml
  - .config/ci/gitlab/deployment.yml

variables:
  ARTIFACTS_DIR: build/artifacts
  ui_dir: cognos/ui
  ui_reports_dir: $ui_dir/coverage
  rbac_dir: cognos/rbac/core/bin/rbac-client-repo
  rbac_client_reports_dir: $rbac_dir/coverage
  backend_reports_dir: scripts/test-reports/ut
  RBAC_UI_PORT: 6720
  RBAC_BACKEND_PORT: 6721
  MONGODB_PORT: 1027
  UI_PORT: 5000
  BACKEND_PORT: 4000
  RESTSERVER_PORT: 8001
  NODE_PORT: 9998
  SUB_PORT: 5555
  INFLUX_PASS: Samsung123!
  INFLUX_ORG: Samsung
  INFLUX_BUCKET: internal
  MYSQL_DEV_PASSWORD: CXL123mem!
  SVK_DIR: /usr/local/svk
  SSL_ENABLED: "false"  # or "true"
  # RBAC Super Admin Configuration
  SUPER_ADMIN_USERNAME: "super_admin"
  SUPER_ADMIN_EMAIL: "super_admin@samsung.com"
  SUPER_ADMIN_PASSWORD: "Admin@123"
  NEW_ADMIN_USERNAME: "admin"
  NEW_ADMIN_EMAIL: "admin@samsung.com"
  NEW_ADMIN_PASSWORD: "Admin@123"
  NEW_ADMIN_ROLE: "admin"  

build docker:
  parallel:
    matrix:
      - DOCKERFILE_NAME: ubuntu22
      - DOCKERFILE_NAME: ubuntu24
      - DOCKERFILE_NAME: ol10
      - DOCKERFILE_NAME: ol9

# Do not use artifacts from previous stage when scanning pycodestyle
pycodestyle:
  dependencies: []

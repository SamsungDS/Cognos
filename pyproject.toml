# pyproject.toml
[tool.pytest.ini_options]
pythonpath = [

    "cognos/backend/",
    "cognos/exporter/",
    "cognos/ssdp/",
    "cognos/subscriber/",
    "cognos/telegraf/"
]

testpaths = [

    "cognos/backend/test",
    "cognos/exporter/test",
    "cognos/ssdp/tests",
    "cognos/subscriber/test",
    "cognos/telegraf/test"
]

[tool.coverage.run]
omit = [
    "/usr/*",
    "*test*",
]
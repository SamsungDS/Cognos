---

- name: Set Ansible user password
  ansible.builtin.user:
    name: "{{ create_ansible_user_name }}"
    password: "{{ create_ansible_user_password }}"
    update_password: always
    comment: "Password will be changed after playbook execution for security"

- name: Display password change notice
  ansible.builtin.debug:
    msg: "Password has been set for user '{{ create_ansible_user_name }}'. Please change it after playbook execution for security."

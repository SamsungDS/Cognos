---
- name: Check if cognos_core RPM is installed
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      dnf list --installed | grep cognos-core
    executable: /bin/bash
  register: cognos_core_install_query
  changed_when: false
  failed_when: false

- name: Determine OS type and version
  ansible.builtin.set_fact:
    cognos_core_install_os_family: "{{ ansible_distribution }}"
    cognos_core_install_os_version: "{{ ansible_distribution_version }}"

- name: Identify cognos_core package for OEL
  ansible.builtin.find:
    path: "{{ cognos_pkg_dir }}"
    patterns: "cognos-core*el{{ ansible_distribution_major_version }}*.rpm"
  delegate_to: localhost
  run_once: true
  register: cognos_core_install_pkg

- name: Assert cognos_core package found for OEL
  ansible.builtin.assert:
    that: cognos_core_install_pkg.files | length > 0
    fail_msg: "No cognos_core package found. Please download package to {{ artifacts_dir }}"

- name: Identify newest version of cognos_core rpm found
  ansible.builtin.set_fact:
    cognos_core_install_pkg_file: "{{ (cognos_core_install_pkg.files | sort(attribute='mtime', reverse=true) | first).path }}"
  run_once: true

- name: Copy cognos_core package to staging directory
  ansible.builtin.copy:
    src: "{{ cognos_core_install_pkg_file }}"
    dest: "{{ deploy_staging_dir }}"
    mode: "0644"
  when: cognos_core_install_query.rc != 0

- name: Install cognos_core RPM
  ansible.builtin.dnf:
    name: "{{ deploy_staging_dir }}/{{ cognos_core_install_pkg_file | basename }}"
    state: present
    disable_gpg_check: true
  become: true
  when: cognos_core_install_query.rc != 0

- name: Delete cognos_core from staging directory
  ansible.builtin.file:
    path: "{{ deploy_staging_dir }}/{{ cognos_core_install_pkg_file | basename }}"
    state: absent
  when: cognos_core_install_pkg_file is defined

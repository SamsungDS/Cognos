---
- name: Check if cognos-mgmt-fw DEB is installed
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      apt list --installed | grep cognos-mgmt-fw
    executable: /bin/bash
  register: cognos_mgmt_fw_install_pkg_query
  changed_when: false
  failed_when: false

- name: Determine OS type and version
  ansible.builtin.set_fact:
    cognos_mgmt_fw_install_os_family: "{{ ansible_distribution }}"
    cognos_mgmt_fw_install_os_version: "{{ ansible_distribution_version }}"

- name: Identify cognos-mgmt-fw package for Ubuntu
  ansible.builtin.find:
    path: "{{ cognos_pkg_dir }}"
    patterns: "cognos-mgmt-fw*-ubuntu{{ cognos_mgmt_fw_install_os_version }}_*.deb"
  delegate_to: localhost
  run_once: true
  register: cognos_mgmt_fw_install_pkg

- name: Assert cognos-mgmt-fw package found
  ansible.builtin.assert:
    that: cognos_mgmt_fw_install_pkg.files | length > 0
    fail_msg: "No cognos-mgmt-fw {{ cognos_mgmt_fw_install_os_family }} package found. Please download it to {{ artifacts_dir }}"

- name: Identify newest version of cognos-mgmt-fw package found
  ansible.builtin.set_fact:
    cognos_mgmt_fw_install_pkg_file: "{{ (cognos_mgmt_fw_install_pkg.files | sort(attribute='mtime', reverse=true) | first).path }}"
  run_once: true

- name: Copy cognos-mgmt-fw DEB to staging directory
  ansible.builtin.copy:
    src: "{{ cognos_mgmt_fw_install_pkg_file }}"
    dest: "{{ deploy_staging_dir }}"
    mode: "0644"
  when: cognos_mgmt_fw_install_pkg_query.rc != 0

- name: Install cognos-mgmt-fw DEB
  ansible.builtin.apt:
    deb: "{{ deploy_staging_dir }}/{{ cognos_mgmt_fw_install_pkg_file | basename }}"
    state: present
  become: true
  when: cognos_mgmt_fw_install_pkg_query.rc != 0

- name: Delete cognos_mgmt-fw DEB from staging directory
  ansible.builtin.file:
    path: "{{ deploy_staging_dir }}/{{ cognos_mgmt_fw_install_pkg_file | basename }}"
    state: absent
  when: cognos_mgmt_fw_install_pkg_file is defined

- name: Install certificates
  ansible.builtin.include_tasks: cognos_mgmt_fw_install_certificates.yml

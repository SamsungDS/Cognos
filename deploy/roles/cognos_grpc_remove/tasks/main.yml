---
- name: Check if cognos-grpc RPM is installed
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      dnf list --installed | grep cognos-grpc
    executable: /bin/bash
  register: cognos_grpc_remove_pkg_query
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] == "OracleLinux"

- name: Remove the installed cognos-grpc
  ansible.builtin.dnf:
    name: cognos-grpc
    state: absent
  become: true
  when:
    - ansible_facts['distribution'] == "OracleLinux"
    - cognos_grpc_remove_pkg_query.rc == 0

deployment pipeline:
  stage: deploy
  environment:
    name: cognos-dev
    url: http://$VM_NAME.$LAB_DOMAIN:$UI_PORT
  trigger:
    include:
      - local: .config/ci/gitlab/deploy-targets.yml
      - local: .config/ci/gitlab/vmware.yml
      - local: .config/ci/gitlab/ansible-deploy.yml
    strategy: depend
  resource_group: ansible_dev
  rules:
    - !reference [.default_rules, merge_and_push]
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID

# Deployment targets: VM short names (<name>.$LAB_DOMAIN, same name in vSphere). The names and the domain are
# CI/CD variables of the project: DEPLOY_TARGET_OL10, DEPLOY_TARGET_UBUNTU24, LAB_DOMAIN.
# To add a VM:
#   1. add it to the TARGET_VM list of "restore vmware snapshot"
#   2. add an "ansible-deploy[<os>]" job for it; <os> is the OS target the VM reports
#      (ubuntu24, ubuntu22, ol10, ...) and is checked at deploy time
# Every VM needs the svk-ansible CI deploy key (CI_KEY) authorized for root and a
# vSphere snapshot of its clean state, which is reverted before every deploy.

restore vmware snapshot:
  extends: .restore-vmware-snapshot
  parallel:
    matrix:
      - TARGET_VM:
          - $DEPLOY_TARGET_OL10
          - $DEPLOY_TARGET_UBUNTU24

# Deployed from the shared docker runner.
ansible-deploy[ol10]:
  extends: .ansible-deploy
  variables:
    TARGET_VM: $DEPLOY_TARGET_OL10

# Deployed from the docker runner on the VM itself (runner tagged with the VM name).
ansible-deploy[ubuntu24]:
  extends: .ansible-deploy
  tags:
    - $DEPLOY_TARGET_UBUNTU24
  variables:
    TARGET_VM: $DEPLOY_TARGET_UBUNTU24

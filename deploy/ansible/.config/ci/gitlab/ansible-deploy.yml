.ansible-deploy:
  stage: deploy
  image:
    name: $IMAGE_TAG
    pull_policy: always
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$CI_KEY" | tr -d '\r' > ~/.ssh/svk-ci-deploy
    - chmod 600 ~/.ssh/svk-ci-deploy
    - ansible-galaxy collection install -r collections/requirements.yml
    - OS_TARGET=$(ssh -i ~/.ssh/svk-ci-deploy -o StrictHostKeyChecking=no root@$TARGET_VM.$LAB_DOMAIN
        "source /etc/os-release;
        if [[ \$ID == ubuntu ]]; then echo ubuntu\${VERSION_ID%%.*};
        elif [[ \$ID == ol ]]; then echo ol\${VERSION_ID%%.*};
        else echo unknown; fi")
    - echo "Detected OS target:$OS_TARGET"
    - >-
      case "$CI_JOB_NAME" in *"[$OS_TARGET]"*) ;; *)
      echo "$TARGET_VM runs $OS_TARGET, which does not match job $CI_JOB_NAME"; exit 1;;
      esac
    - >-
      case " $SCMC_UNSUPPORTED_OS " in *" $OS_TARGET "*)
      COGNOS_INSTALL_GUI_ENABLED=false; COGNOS_RBAC_ENABLED=false;
      echo "SCMC (GUI/RBAC) is not available on $OS_TARGET, deploying without it";;
      esac
    - bash scripts/release.sh --os "$OS_TARGET" --mock
    - sed -i -e "s/hostname[0-9]\/host_ip[0-9]/$TARGET_VM.$LAB_DOMAIN/g" -e "s/<user name>/root/" hosts
    - 'echo "$ANSIBLE_VAULT_PASSWORD" > "$CI_PROJECT_DIR/.vault_pass"'
    - 'echo "vault_ansible_password: $ANSIBLE_VAULT_PASSWORD" > group_vars/all/passwords.yml'
    - 'ansible-vault encrypt group_vars/all/passwords.yml --vault-password-file "$CI_PROJECT_DIR/.vault_pass"'
  script:
    # JSON extra-vars so the flags are booleans; "-e key=false" would pass the truthy string "false"
    - >-
      ansible-playbook -i hosts playbooks/deploy_cognos.yml
      --private-key ~/.ssh/svk-ci-deploy
      -e application_server_type=CMMH
      -e "{\"scmc_cxl_mock_enable\": true,
      \"cognos_install_gui_enabled\": $COGNOS_INSTALL_GUI_ENABLED,
      \"cognos_rbac_enabled\": $COGNOS_RBAC_ENABLED}"
      --vault-password-file "$CI_PROJECT_DIR/.vault_pass"
    - ssh -i ~/.ssh/svk-ci-deploy -o StrictHostKeyChecking=no root@$TARGET_VM.$LAB_DOMAIN
        "rpm -q cognos-cxl-mock 2>/dev/null || dpkg-query -W cognos-cxl-mock"
  after_script:
    - rm -rf group_vars/all/passwords.yml
  variables:
    ANSIBLE_HOST_KEY_CHECKING: "False"
    ANSIBLE_FORCE_COLOR: "true"
    ANSIBLE_CONFIG: ansible.cfg
    DOCKERFILE_NAME: ubuntu22
    IMAGE_TAG: $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$DOCKER_BRANCH_NAME
    COGNOS_INSTALL_GUI_ENABLED: "true"
    COGNOS_RBAC_ENABLED: "true"
    # Space-separated OS targets without an SCMC build/RBAC license
    SCMC_UNSUPPORTED_OS: ubuntu24
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"

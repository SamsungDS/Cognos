---
- name: Get hostname
  ansible.builtin.command: hostname
  register: management_server_start_hw_hostname
  changed_when: false

- name: Get hostname of the first application server
  ansible.builtin.command: hostname
  delegate_to: "{{ hostvars[groups['application_server'][0]]['inventory_hostname'] }}"
  register: management_server_start_hw_app_hostname
  changed_when: false

- name: Configure mgmt_fw_config
  ansible.builtin.template:
    src: mgmt_fw_config.j2
    dest: "/etc/svk/mgmt_fw_config.json"
    mode: "0644"
  vars:
    ip: "{{ ansible_default_ipv4.address }}"
    node_name: "{{ management_server_start_hw_app_hostname.stdout }}"
    node_ip: "{{ hostvars[groups['application_server'][0]].ansible_default_ipv4.address }}"
  become: true

- name: Configure mgmt-fw input.json
  ansible.builtin.template:
    src: mgmt_fw_input.j2
    dest: "/usr/local/svk/mgmt-fw/input.json"
    mode: "0644"
  become: true

- name: Start management services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  become: true
  failed_when: false
  loop:
    - cognos-controller.service
    - cognos-restserver.service

- name: Gather service status
  ansible.builtin.service_facts:
  changed_when: false

- name: Check service status on management server
  ansible.builtin.assert:
    that:
      - item in ansible_facts.services
      - ansible_facts.services[item].state == 'running'
    fail_msg: "{{ item }} failed to start!"
    success_msg: "{{ item }} started successfully."
  loop:
    - cognos-controller.service
    - cognos-restserver.service
  register: management_server_start_hw_check
  ignore_errors: true

- name: Set flag if any service failed the check
  ansible.builtin.set_fact:
    management_server_start_hw_flag: "{{ management_server_start_hw_check.results |
      selectattr('failed', 'defined') |
      selectattr('failed') |
      list | length > 0 }}"

- name: Restart all service after systemd daemon reload
  ansible.builtin.include_role:
    name: cognos_service_restart
  vars:
    cognos_service_restart_list:
      - cognos-controller.service
      - cognos-restserver.service
  when: management_server_start_hw_flag | default(false)

- name: Start cognos-node service on management server
  ansible.builtin.service:
    name: cognos-node.service
    state: started
    enabled: true
  become: true
  failed_when: false
  when:
    management_server_type == 'CMMB'

- name: Gather service status
  ansible.builtin.service_facts:
  changed_when: false

- name: Check service status on management server
  ansible.builtin.assert:
    that:
      - item in ansible_facts.services
      - ansible_facts.services[item].state == 'running'
    fail_msg: "{{ item }} failed to start!"
    success_msg: "{{ item }} started successfully."
  loop:
    - cognos-node.service
  register: management_server_start_hw_node_check
  ignore_errors: true
  when:
    management_server_type == 'CMMB'

- name: Set flag if any service failed the check
  ansible.builtin.set_fact:
    management_server_start_hw_node_flag: "{{ management_server_start_hw_node_check.results |
      selectattr('failed', 'defined') |
      selectattr('failed') |
      list | length > 0 }}"
  when: management_server_type == 'CMMB'

- name: Restart all service after systemd daemon reload
  ansible.builtin.include_role:
    name: cognos_service_restart
  vars:
    cognos_service_restart_list:
      - cognos-node.service
  when: management_server_start_hw_node_flag | default(false)

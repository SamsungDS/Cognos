- name: Remove server directories using shell
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for dir in /mnt/gemfire*/server*; do
        if [[ -e "$dir" ]]; then
          echo "Removing: $dir"
          rm -rf "$dir"
        fi
      done
  args:
    executable: /bin/bash
  changed_when: true
  failed_when: false

- name: Synchronize the data to disk and discard the cache
  ansible.builtin.shell: |
    sync
    echo 3 > /proc/sys/vm/drop_caches
  args:
    executable: /bin/bash
  become: true
  changed_when: true

- name: Search and kill all dstat processes
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ps aux |
      grep -i dstat |
      grep output |
      grep python |
      grep -v grep |
      awk '{print $2}' |
      xargs -r kill -9
  args:
    executable: /bin/bash
  become: true
  changed_when: true
  failed_when: false

- name: Search and kill all gemfire processes
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ps aux |
      grep -i gemfire |
      grep -v grep |
      awk '{print $2}' |
      xargs -r kill -9
  args:
    executable: /bin/bash
  become: true
  changed_when: true
  failed_when: false

- name: Stop damo
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      damo stop
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  failed_when: false

- name: Search and kill all damo processes
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ps aux |
      grep -i damo |
      grep -v grep |
      awk '{print $2}' |
      xargs -r kill -9
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  failed_when: false

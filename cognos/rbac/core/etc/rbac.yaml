backend:
  url: ''
  #url: 'https://105.128.44.67:6721' or url: 'http://105.128.44.67:6721'
email:
  service: ''  # Email service provider (e.g., 'gmail', 'yahoo', 'hotmail', 'outlook', 'smtp')
  user: ''  # Your email address
  pass: ''  # Your email password

  # Other possible values for the 'service' field:
  # - 'gmail': Use Google's Gmail service
  # - 'yahoo': Use Yahoo Mail service
  # - 'hotmail': Use Microsoft's Hotmail/Outlook service
  # - 'outlook': Use Microsoft's Outlook service
  # - 'smtp': Use a custom SMTP server (requires additional configuration such as host, port, and secure)
  
  # Example configuration for using a custom SMTP server:
  # service: 'smtp'  # Use a custom SMTP server
  # host: 'smtp.example.com'  # SMTP server hostname
  # port: 587  # SMTP server port (usually 587 for TLS, 465 for SSL, or 25 for unencrypted)
  # secure: false  # True for SSL (port 465), false for TLS (port 587)
  # user: 'your-email@example.com'  # Your email address
  # pass: 'your-email-password'  # Your email password
pages:
  - path: "/"
    permission: "read:all"
  - path: "/login"
    permission: "read:all"
  - path: "/signup"
    permission: "read:all"
  - path: "/profile"
    permission: "<fill permission here>"
  - path: "/users"
    permission: "<fill permission here>"
  - path: "/admin"
    permission: "read:admin"
  - path: "/dashboard"
    permission: "read:dashboard"
    additionalFields:
      - ''

roles:
  admin:
    permissions:
      - "read:admin"
      - "write:admin"
      - "read:dashboard"
    roles:
      - "admin"
    filters:
      users: "limited"
  guest:
    permissions:
      - "read:dashboard"
      - "read:profile"
    roles:
      - "guest"
    filters:
      users: "own"
  user:
    permissions:
      - "read:dashboard"
      - "read:profile"
    roles:
      - "user"
    filters:
      users: "own"
license:
  key: '7e35f9e03847b71c11143924faee854e:'
  productID: 'prod-66hinoatktxdi'
  subscriptionID: 'RBAC-prod-66hinoatktxdi-TRIAL'
internet-communication: 'Y'
  # 'Y': Enable automatic communication with the BV Licensing Server.
  #      This allows:
  #        - Automatic updates from the BV Licensing Server
  #        - Automatic license key updates
  #        - Automatic subscription updates
  # 'N': Disable automatic communication with the BV Licensing Server.
  #      This means:
  #        - You will need to manually retrieve and update license keys
  #        - Subscription updates must be handled manually
  #        - Server updates will not be downloaded automatically

user-approval-workflow: 'Y'
  # 'Y': Enable user approval workflow.
  #      This means:
  #        - New user registrations require owner approval after email verification
  #        - Only approved users can log in to the system
  #        - Owner receives notifications for pending approvals
  # 'N': Disable user approval workflow.
  #      This means:
  #        - Users can log in immediately after email verification
  #        - No manual approval required

email-verification: 'N'
  # 'Y': Enable email verification for new user registrations.
  #      This means:
  #        - Users must verify their email before accessing the system
  #        - Verification email is sent automatically upon registration
  # 'N': Disable email verification.
  #      This means:
  #        - Users can access the system immediately after registration
  #        - No email verification required

signupRoles:  # Roles that users can select during registration
  - "admin"
  - "guest"

.ui_npm_cache:
  cache:
    - key:
        files:
          - cognos/ui/package-lock.json
        prefix: ui
      paths:
        - cognos/ui/node_modules
        - .npm
      policy: pull-push

.rbac_npm_cache:
  cache:
    - key:
        files:
          - cognos/rbac/core/bin/rbac-client-repo/package-lock.json
        prefix: rbac
      paths:
        - cognos/rbac/core/bin/rbac-client-repo/node_modules
        - .npm
      policy: pull-push

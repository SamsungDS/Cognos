integration test:
  stage: .post
  image:
    name: $IMAGE_TAG
    pull_policy: always
  before_script:
    # Configure selenium config file in a single jq pass (jq + moreutils are baked into the docker image)
    - |
      jq --arg name "$VM_NAME.msl.lab" --arg user "$USERNAME" --arg pass "$PASSWORD" '
        .dashboard_url = "http://\($name):5000/" |
        .configure_url = "http://\($name):5000/configure" |
        .metrics_url   = "http://\($name):5000/metrics" |
        .scmc_url      = "http://\($name):5000" |
        .host_name     = $name |
        .username      = $user |
        .password      = $pass
      ' "$INTEGRATION_TEST_DIR/config/config.json" | sponge "$INTEGRATION_TEST_DIR/config/config.json"
    # display the configuration file
    - cat $INTEGRATION_TEST_DIR/config/config.json
  script:
    - ./scripts/run-tests.sh --it
  artifacts:
    name: integration test
    expire_in: 300 seconds
    paths:
     - scmc_tests.xml
    reports:
      junit: scmc_tests.xml
  variables:
    DOCKERFILE_NAME: ubuntu22
    IMAGE_TAG: $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$DOCKER_BRANCH_NAME
    INTEGRATION_TEST_DIR: cognos/ui/tests/it/selenium
    USERNAME: admin
    PASSWORD: Admin@123
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"


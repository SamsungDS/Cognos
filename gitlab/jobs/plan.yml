# The gate: runs in every pipeline. It records what the change selects
# (plan.json, plan.txt) and runs the repository guards.
plan:
  extends: .ci-tools-job
  stage: plan
  variables:
    GIT_DEPTH: "0"
  script:
    - source ci/scm/gitlab.sh
    - scm_env
    - bash ci/scripts/plan.sh --format json --text-out plan.txt > plan.json
    - cat plan.txt
    # guards.txt keeps the reasons of a failed gate with the artifacts.
    - set -o pipefail; bash ci/scripts/guards.sh 2>&1 | tee guards.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - plan.json
      - plan.txt
      - guards.txt

# Checks of the CI itself: the ci/ test suite, shellcheck, the generated
# files and a CI Lint check. Runs when CI files change, and nightly.
hygiene:
  extends: .ci-tools-job
  stage: test
  script:
    - bash ci/tests/run_all.sh
    - find ci -type f -name '*.sh' -print0 | xargs -0 shellcheck -x build.sh
    - bash ci/scripts/generate-gitlab.sh --check
    # Optional: CI Lint of this commit's configuration. The job token may not
    # be allowed to call the lint API; then the log says it was NOT performed.
    # No dry run:
    # a simulated push has an all-zero 'before' commit, which workflow rule 4
    # (branch creation) always rejects.
    - |
      lint_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/ci/lint?content_ref=$CI_COMMIT_SHA"
      cacert=()
      if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ]; then cacert=(--cacert "$CI_SERVER_TLS_CA_FILE"); fi
      status=$(curl -sS "${cacert[@]}" -o lint.json -w '%{http_code}' -H "JOB-TOKEN: $CI_JOB_TOKEN" "$lint_url") || true
      status=${status:-000}
      if [ "$status" = "200" ]; then
        jq '{valid, errors, warnings}' lint.json
        [ "$(jq -r .valid lint.json)" = "true" ] || { echo "CI Lint reports errors"; exit 1; }
      else
        echo "NOTE: CI Lint NOT performed (HTTP $status): the lint API refused the job token"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "nightly"
    # The CI part of .selection.platform in ci/selection.yml; keep the two in
    # step. These are also the only files ci/tests/hygiene_test.sh scans, so
    # a docs-only change never runs hygiene.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &hygiene-paths
        - ci/**/*
        - gitlab/**/*
        - build.sh
        - VERSION
      interruptible: true
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      changes: *hygiene-paths

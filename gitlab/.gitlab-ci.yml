# Cognos monorepo pipeline. One pipeline per event, no child pipelines.
# See docs/ci.md.
#
# This file only decides WHEN jobs run and passes GitLab's variables to the
# scripts that do the work (build.sh, ci/version.sh, ci/image.sh), which do
# not depend on GitLab.
#
#   1. Includes, workflow, stages
#   2. What a change rebuilds
#   3. Job templates: image, build, test, scan
#   4. Components, one block each with all of its jobs
#   5. Dev set
#   6. Releases
#   7. Sync from the component repositories
#   8. Deploy to the lab
#   9. Other jobs: check version, amo-prof, ansible
#
# The pipeline that came with deploy/ (deploy/.gitlab-ci.yml) is deliberately
# not included. Its deploy stage restores VM snapshots and deploys as root to
# shared lab VMs.

# ---------------------------------------------------------------------------
# 1. Includes, workflow, stages
# ---------------------------------------------------------------------------

include:
  - project: dfs/svk/tools
    ref: efbaaadf825e3525126e506fc6400c91c794f406
    file: .config/ci/gitlab/defaults.yml
  - project: dfs/svk/tools
    ref: efbaaadf825e3525126e506fc6400c91c794f406
    file: .config/ci/gitlab/docker.yml
  - local: deploy/.config/ci/gitlab/lint.yml

workflow:
  rules:
    # Merge requests.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Release tags vX.Y.Z. A tag push has no 'before' commit, so this comes
    # before the new-branch rule. The imported prefixed tags never run.
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_COMMIT_TAG
      when: never
    # Pushes to main. main always exists, so the new-branch rule below does
    # not apply to it.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    # A push that creates a branch has no 'before' commit.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"
      when: never
    # Pushes to release/X.Y.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release\/[0-9]+\.[0-9]+$/
    # Schedules and runs from the web UI.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    # Nothing else matches, so nothing else runs.

stages:
  - build-images
  - build
  - test
  - scan
  - publish
  - release
  - deploy

variables:
  # The lab runners lose DNS or network for a few seconds now and then; retry
  # the repository fetch and artifact downloads instead of failing the job.
  GET_SOURCES_ATTEMPTS: 3
  ARTIFACT_DOWNLOAD_ATTEMPTS: 3

# ---------------------------------------------------------------------------
# 2. What a change rebuilds
# ---------------------------------------------------------------------------
# A change in this list rebuilds and tests every component. Each component
# block in section 4 adds its own folder, which rebuilds only that component.
# In tag, schedule and web pipelines GitLab treats every 'changes' rule as
# true, so those pipelines run every job (images are still reused, see
# ci/image.sh).

.rebuild-all: &rebuild-all
  - components/core/**/*
  - components/mgmt-fw/**/*
  - gitlab/**/*
  - ci/**/*
  - VERSION
  - build.sh
  - deploy/scripts/fetch-packages.py

# ---------------------------------------------------------------------------
# 3. Job templates
# ---------------------------------------------------------------------------
# Every component block sets COMPONENT and COMPONENT_DIR. Build and test jobs
# run in the image of their commit, $CI_REGISTRY_IMAGE/<component>:<os>-<sha>,
# so overlapping pipelines never use each other's image.

# Trust the internal CAs also in Python, curl and git, for this GitLab's API,
# downloads and repository (build.sh gets upstream packages from the dev set;
# the release jobs read and write tags and branches).
.internal-ca:
  before_script:
    - cat /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt > /tmp/ca-bundle.crt 2> /dev/null || true
    - printf '%s\n' "$SSI_ROOTCA_CERT" "$SSI_ISSUINGCA_CERT" "$MSL_ETX_CERT" >> /tmp/ca-bundle.crt
    - export SSL_CERT_FILE=/tmp/ca-bundle.crt GIT_SSL_CAINFO=/tmp/ca-bundle.crt

# The one version of every package in this pipeline (ci/version.sh).
.version:
  before_script:
    - COGNOS_VERSION=$(ci/version.sh --tag "$CI_COMMIT_TAG" --mr "$CI_MERGE_REQUEST_IID" --branch "$CI_COMMIT_BRANCH" --run "$CI_PIPELINE_IID")
    - export COGNOS_VERSION
    - echo "Cognos version $COGNOS_VERSION"

# Builds the component image only when its Dockerfile or scripts/dependencies
# changed, otherwise reuses it (ci/image.sh).
.image:
  stage: build-images
  image: docker:25.0.3-git
  needs: []
  before_script:
    # Trust the internal CAs, so that buildx can reach the registry, then log in.
    - echo "$SSI_ROOTCA_CERT" > /usr/local/share/ca-certificates/internal-root-ca.crt
    - echo "$SSI_ISSUINGCA_CERT" > /usr/local/share/ca-certificates/internal-issuing-ca.crt
    - echo "$MSL_ETX_CERT" > /usr/local/share/ca-certificates/internal-lab.crt
    - update-ca-certificates --fresh > /dev/null
    - printf '[registry."%s"]\n  ca=["/etc/ssl/certs/ca-certificates.crt"]\n' "$CI_REGISTRY" > /buildkitd.toml
    - docker buildx create --driver=docker-container --name=builder --use --config /buildkitd.toml
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - ci/image.sh "$COMPONENT_DIR" "$OS" "$CI_REGISTRY_IMAGE/$COMPONENT" "$CI_COMMIT_SHORT_SHA"
  parallel:
    matrix:
      - OS: [ubuntu24, ol10]

# Builds the release packages (build.sh). Upstream core and mgmt-fw packages
# come from this pipeline's "build core" / "build mgmt-fw" if they ran, else
# from the newest dev set, else from the image.
.build:
  stage: build
  image:
    name: $CI_REGISTRY_IMAGE/$COMPONENT:$OS-$CI_COMMIT_SHORT_SHA
    pull_policy: always
  before_script:
    - !reference [.internal-ca, before_script]
    - !reference [.version, before_script]
  script:
    - ./build.sh --native "$COMPONENT" --os "$OS"
  artifacts:
    name: $CI_JOB_NAME
    expire_in: 14 days
    paths:
      - $COMPONENT_DIR/build/artifacts/
  parallel:
    matrix:
      - OS: [ubuntu24, ol10]

# Runs the component's unit tests (build.sh --test). The test build runs under
# Sonar's build-wrapper (TEST_WRAPPER), which records the compiler calls for
# "scan <component>".
.test:
  stage: test
  image:
    name: $CI_REGISTRY_IMAGE/$COMPONENT:$OS-$CI_COMMIT_SHORT_SHA
    pull_policy: always
  # One automatic retry: some component tests are flaky (e.g. node's
  # DownstreamAPITests.ExecuteSyncSuccess), and a release, a dev set and the
  # lab deploy need every test. A real failure fails twice and still stops them.
  retry:
    max: 1
    when: [script_failure]
  variables:
    TEST_WRAPPER: /opt/build-wrapper-linux-x86/build-wrapper-linux-x86-64 --out-dir $CI_PROJECT_DIR/$COMPONENT_DIR/bw-output
  before_script:
    - !reference [.internal-ca, before_script]
    - !reference [.version, before_script]
    - wget --no-verbose -P /tmp "$SONAR_HOST_URL/static/cpp/build-wrapper-linux-x86.zip"
    - unzip -q /tmp/build-wrapper-linux-x86.zip -d /opt
  script:
    - ./build.sh --native --test "$COMPONENT" --os "$OS"
  artifacts:
    name: $CI_JOB_NAME
    when: always
    expire_in: 1 day
    paths:
      - $COMPONENT_DIR/bw-output/
      - $COMPONENT_DIR/build/
    reports:
      junit: $COMPONENT_DIR/build/reports/*junit.xml
      coverage_report:
        coverage_format: cobertura
        path: $COMPONENT_DIR/build/reports/gitlab_coverage.xml
  parallel:
    matrix:
      - OS: [ubuntu24, ol10]
  rules:
    # Merge requests test on ubuntu24 only; all other pipelines on both.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $OS == "ol10"
      when: never

# Sonar analysis of the ubuntu24 test results, on main only. Always a branch
# analysis (SONAR_BRANCH) of the component's existing Sonar project, so the
# component repository's own main analysis is never touched.
.scan:
  stage: scan
  image:
    name: $CI_REGISTRY_IMAGE/$COMPONENT:$OS-$CI_COMMIT_SHORT_SHA
    pull_policy: always
  variables:
    OS: ubuntu24
    GIT_DEPTH: 0
    SONAR_BRANCH: branch-cognos-monorepo
    SONAR_ARGS: -Dsonar.coverageReportPaths=build/reports/sonar_coverage.xml
  script:
    - wget --no-verbose -P /tmp "$SONAR_SCANNER_URL"
    - unzip -q "/tmp/${SONAR_SCANNER_URL##*/}" -d /opt/sonar-scanner
    - cd "$COMPONENT_DIR"
    - /opt/sonar-scanner/*/bin/sonar-scanner -Dsonar.branch.name="$SONAR_BRANCH" $SONAR_ARGS
  rules:
    - if: $CI_PIPELINE_SOURCE != "push" || $CI_COMMIT_BRANCH != "main"
      when: never

# ---------------------------------------------------------------------------
# 4. Components
# ---------------------------------------------------------------------------
# Each block: the component's variables and paths, then its jobs. "needs"
# lists the upstream builds; they are optional because a leaf-only change
# does not run them.

# --- core ------------------------------------------------------------------
.core:
  variables:
    COMPONENT: core
    COMPONENT_DIR: components/core
  rules:
    - changes: *rebuild-all
    - changes: [components/core/**/*]

build core image:
  extends: [.image, .core]
build core:
  extends: [.build, .core]
  needs: ["build core image"]
test core:
  extends: [.test, .core]
  rules: [!reference [.test, rules], !reference [.core, rules]]
  needs: ["build core image"]
scan core:
  extends: [.scan, .core]
  rules: [!reference [.scan, rules], !reference [.core, rules]]
  needs: [{job: test core, parallel: {matrix: [{OS: ubuntu24}]}}]

# --- mgmt-fw ---------------------------------------------------------------
.mgmt-fw:
  variables:
    COMPONENT: mgmt-fw
    COMPONENT_DIR: components/mgmt-fw
  rules:
    - changes: *rebuild-all
    - changes: [components/mgmt-fw/**/*]

build mgmt-fw image:
  extends: [.image, .mgmt-fw]
build mgmt-fw:
  extends: [.build, .mgmt-fw]
  needs: ["build mgmt-fw image", {job: build core, optional: true}]
test mgmt-fw:
  extends: [.test, .mgmt-fw]
  rules: [!reference [.test, rules], !reference [.mgmt-fw, rules]]
  needs: ["build mgmt-fw image", {job: build core, optional: true}]
scan mgmt-fw:
  extends: [.scan, .mgmt-fw]
  rules: [!reference [.scan, rules], !reference [.mgmt-fw, rules]]
  needs: [{job: test mgmt-fw, parallel: {matrix: [{OS: ubuntu24}]}}]
  variables:
    SONAR_ARGS: -Dsonar.coverageReportPaths=build/reports/sonar_coverage.xml -Dsonar.go.coverage.reportPaths=build/reports/go_coverage.out

# --- node ------------------------------------------------------------------
.node:
  variables:
    COMPONENT: node
    COMPONENT_DIR: components/node
  rules:
    - changes: *rebuild-all
    - changes: [components/node/**/*]

build node image:
  extends: [.image, .node]
build node:
  extends: [.build, .node]
  needs: ["build node image", {job: build core, optional: true}]
test node:
  extends: [.test, .node]
  rules: [!reference [.test, rules], !reference [.node, rules]]
  needs: ["build node image", {job: build core, optional: true}]
scan node:
  extends: [.scan, .node]
  rules: [!reference [.scan, rules], !reference [.node, rules]]
  needs: [{job: test node, parallel: {matrix: [{OS: ubuntu24}]}}]
  variables:
    SONAR_ARGS: -Dsonar.coverageReportPaths=build/reports/sonar_coverage.xml -Dsonar.python.coverage.reportPaths=build/reports/python_coverage.xml

# --- ras -------------------------------------------------------------------
.ras:
  variables:
    COMPONENT: ras
    COMPONENT_DIR: components/ras
  rules:
    - changes: *rebuild-all
    - changes: [components/ras/**/*]

build ras image:
  extends: [.image, .ras]
build ras:
  extends: [.build, .ras]
  needs: ["build ras image", {job: build core, optional: true}]
test ras:
  extends: [.test, .ras]
  rules: [!reference [.test, rules], !reference [.ras, rules]]
  needs: ["build ras image", {job: build core, optional: true}]
scan ras:
  extends: [.scan, .ras]
  rules: [!reference [.scan, rules], !reference [.ras, rules]]
  needs: [{job: test ras, parallel: {matrix: [{OS: ubuntu24}]}}]

# --- slat ------------------------------------------------------------------
# The unit tests run Intel MLC, so they need the svk-slat runner.
.slat:
  variables:
    COMPONENT: slat
    COMPONENT_DIR: components/slat
  rules:
    - changes: *rebuild-all
    - changes: [components/slat/**/*]

build slat image:
  extends: [.image, .slat]
build slat:
  extends: [.build, .slat]
  needs: ["build slat image", {job: build core, optional: true}]
test slat:
  extends: [.test, .slat]
  rules: [!reference [.test, rules], !reference [.slat, rules]]
  needs: ["build slat image", {job: build core, optional: true}]
  tags: [svk-slat]
scan slat:
  extends: [.scan, .slat]
  rules: [!reference [.scan, rules], !reference [.slat, rules]]
  needs: [{job: test slat, parallel: {matrix: [{OS: ubuntu24}]}}]

# --- me --------------------------------------------------------------------
# The unit tests need the svk-me runner, and read /etc/shadow as in me's own CI.
.me:
  variables:
    COMPONENT: me
    COMPONENT_DIR: components/me
  rules:
    - changes: *rebuild-all
    - changes: [components/me/**/*]

build me image:
  extends: [.image, .me]
build me:
  extends: [.build, .me]
  needs: ["build me image", {job: build core, optional: true}, {job: build mgmt-fw, optional: true}]
test me:
  extends: [.test, .me]
  rules: [!reference [.test, rules], !reference [.me, rules]]
  needs: ["build me image", {job: build core, optional: true}, {job: build mgmt-fw, optional: true}]
  tags: [svk-me]
  before_script:
    - !reference [.test, before_script]
    - chmod 644 /etc/shadow
scan me:
  extends: [.scan, .me]
  rules: [!reference [.scan, rules], !reference [.me, rules]]
  needs: [{job: test me, parallel: {matrix: [{OS: ubuntu24}]}}]
  variables:
    SONAR_ARGS: -Dsonar.coverageReportPaths=build/reports/sonar_coverage.xml -Dsonar.exclusions=**/mover_damo/damo_main**

# --- cxl -------------------------------------------------------------------
# Two package variants: release (cognos-cxl) and mock (cognos-cxl-mock).
.cxl:
  variables:
    COMPONENT: cxl
    COMPONENT_DIR: components/cxl
  rules:
    - changes: *rebuild-all
    - changes: [components/cxl/**/*]

build cxl image:
  extends: [.image, .cxl]
build cxl:
  extends: [.build, .cxl]
  needs: ["build cxl image", {job: build core, optional: true}, {job: build mgmt-fw, optional: true}]
  script:
    - ./build.sh --native cxl --os "$OS" $(if [ "$VARIANT" = mock ]; then echo --mock; fi)
  parallel:
    matrix:
      - OS: [ubuntu24, ol10]
        VARIANT: [release, mock]
test cxl:
  extends: [.test, .cxl]
  rules: [!reference [.test, rules], !reference [.cxl, rules]]
  needs: ["build cxl image", {job: build core, optional: true}, {job: build mgmt-fw, optional: true}]
scan cxl:
  extends: [.scan, .cxl]
  rules: [!reference [.scan, rules], !reference [.cxl, rules]]
  needs: [{job: test cxl, parallel: {matrix: [{OS: ubuntu24}]}}]

# --- sapp ------------------------------------------------------------------
# Python backend and React UI: no build-wrapper, its own report files, and the
# public Sonar scanner image.
.sapp:
  variables:
    COMPONENT: sapp
    COMPONENT_DIR: apps/sapp
    # npm downloads from the public registry during the package build and the
    # tests; retry dropped or slow connections longer than npm's default.
    NPM_CONFIG_FETCH_RETRIES: "5"
    NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
    NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  rules:
    - changes: *rebuild-all
    - changes: [apps/sapp/**/*]

build sapp image:
  extends: [.image, .sapp]
build sapp:
  extends: [.build, .sapp]
  needs: ["build sapp image"]
  variables:
    # As in sapp's own release-build job: with CI=true, react-scripts build
    # treats warnings as errors.
    CI: "false"
test sapp:
  extends: [.test, .sapp]
  rules: [!reference [.test, rules], !reference [.sapp, rules]]
  needs: ["build sapp image"]
  before_script:
    - !reference [.version, before_script]
  script:
    - ./build.sh --native --test sapp --os "$OS"
  artifacts:
    paths:
      - apps/sapp/scripts/test-reports/
      - apps/sapp/cognos/ui/coverage/
      - apps/sapp/cognos/rbac/core/bin/rbac-client-repo/coverage/
    reports:
      junit:
        - apps/sapp/scripts/test-reports/ut/junit.xml
        - apps/sapp/cognos/ui/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/sapp/scripts/test-reports/ut/coverage.xml
scan sapp:
  extends: [.scan, .sapp]
  rules: [!reference [.scan, rules], !reference [.sapp, rules]]
  needs: [{job: test sapp, parallel: {matrix: [{OS: ubuntu24}]}}]
  image:
    name: sonarsource/sonar-scanner-cli:5.0.1
    entrypoint: [""]
  script:
    - cd apps/sapp
    - >-
      sonar-scanner -Dsonar.branch.name="$SONAR_BRANCH"
      -Dsonar.python.coverage.reportPaths=scripts/test-reports/ut/coverage.xml
      -Dsonar.javascript.lcov.reportPaths=cognos/ui/coverage/lcov.info,cognos/rbac/core/bin/rbac-client-repo/coverage/lcov.info

# ---------------------------------------------------------------------------
# 5. Dev set
# ---------------------------------------------------------------------------
# Every main pipeline publishes a complete dev set as its artifact
# (ci/dev-set.py). For each component and OS whose build and tests passed it
# takes this pipeline's packages; for every other one the previous set's.
# If core or mgmt-fw failed, no set is published: everything depends on them.
# A failed Sonar scan does not hold a set back. It runs in every main pipeline,
# also when nothing was built, so the newest successful pipeline always holds
# the newest set (the newest successful "publish dev set" job, whatever its
# pipeline's status). GitLab never expires the artifacts of the most recent
# pipeline that passed ("Keep artifacts from most recent successful jobs");
# other sets expire after 10 days. Rerunning the job (e.g. after retrying a
# failed job) republishes the set with the new results.
# deploy/scripts/fetch-packages.py downloads a set for deployment.

# Every component's builds (their packages) and tests (artifacts not needed),
# and the tests of the CI scripts.
.built and tested:
  needs:
    - {job: test ci, optional: true}
    - {job: build core, optional: true}
    - {job: build mgmt-fw, optional: true}
    - {job: build node, optional: true}
    - {job: build ras, optional: true}
    - {job: build slat, optional: true}
    - {job: build me, optional: true}
    - {job: build cxl, optional: true}
    - {job: build sapp, optional: true}
    - {job: test core, optional: true, artifacts: false}
    - {job: test mgmt-fw, optional: true, artifacts: false}
    - {job: test node, optional: true, artifacts: false}
    - {job: test ras, optional: true, artifacts: false}
    - {job: test slat, optional: true, artifacts: false}
    - {job: test me, optional: true, artifacts: false}
    - {job: test cxl, optional: true, artifacts: false}
    - {job: test sapp, optional: true, artifacts: false}

publish dev set:
  stage: publish
  image: python:3.12
  resource_group: dev-set
  rules:
    # 'always': also when some builds or tests failed; ci/dev-set.py decides per component.
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(push|schedule|web)$/
      when: always
  needs: !reference [.built and tested, needs]
  before_script:
    - !reference [.internal-ca, before_script]
    - !reference [.version, before_script]
  script:
    - gitlab/scripts/api.py job-results --pipeline "$CI_PIPELINE_ID" | tee results.json
    # The newest set: the newest successful "publish dev set" on main, whatever its pipeline's status.
    - gitlab/scripts/api.py newest-dev-set --out previous
    # cognos-grpc is not built here: the pinned version from Nexus goes into the ol10 set, so that deploying needs
    # nothing but GitLab. If Nexus does not answer, the set keeps the previous set's cognos-grpc.
    - 'ARTIFACTS_DIR=grpc deploy/scripts/fetch-packages.py --os ol10 --grpc || echo "WARNING: cognos-grpc not fetched"'
    - GRPC_RPM=$(ls grpc/cognos-grpc-*.rpm 2> /dev/null | head -n 1 || true)
    - >-
      ci/dev-set.py --version "$COGNOS_VERSION" --pipeline "$CI_PIPELINE_ID" --results results.json
      --previous previous/dev-set ${GRPC_RPM:+--extra ol10=$GRPC_RPM} --out dev-set
  artifacts:
    name: dev-set-$CI_PIPELINE_ID
    expire_in: 10 days
    paths:
      - dev-set/

# ---------------------------------------------------------------------------
# 6. Releases
# ---------------------------------------------------------------------------
# VERSION is the current release line X.Y; main builds X.(Y+1).0~dev. See
# docs/ci.md, "Releases". The GitLab API calls are in gitlab/scripts/api.py and use
# RELEASE_BOT_TOKEN (a protected variable), except "publish release".
#
#   propose release   main, run by hand: compatibility check, then the release
#                     merge request setting VERSION to the next X.Y
#   create release    main push changing VERSION (the release MR merged), or
#                     by hand for the current line: release/X.Y, the tag
#                     vX.Y.P and the label backport-X.Y
#   tag patch         push to release/X.Y: tags the next patch release
#   backport          main push: the merged MR's backport-X.Y labels become
#                     merge requests into release/X.Y
#   publish release   tag vX.Y.Z: packages to the package registry, and the
#                     GitLab release

# They wait for "test ci" when it runs, so a broken script never tags anything.
.release job:
  stage: release
  image: python:3.12
  resource_group: release
  needs:
    - {job: test ci, optional: true}
  before_script:
    - !reference [.internal-ca, before_script]

propose release:
  extends: .release job
  image: ubuntu:24.04
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(push|schedule|web)$/
      when: manual
      allow_failure: true
  variables:
    BUF_VERSION: "1.50.0"
  # The CA bundle needs ca-certificates, which the script installs first.
  before_script: []
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends abigail-tools ca-certificates curl git python3 > /dev/null
    - !reference [.internal-ca, before_script]
    - curl --fail --silent --show-error --location --output /usr/local/bin/buf "https://github.com/bufbuild/buf/releases/download/v$BUF_VERSION/buf-Linux-x86_64"
    - chmod +x /usr/local/bin/buf
    - X_Y=$(cat VERSION)
    # The last release of the current line, e.g. v1.6.3.
    - BASE=$(git ls-remote --tags origin "refs/tags/v$X_Y.*" | sed -n 's|.*refs/tags/\(v[0-9.]*\)$|\1|p' | sort -V | tail -n 1)
    - if [ -z "$BASE" ]; then echo "No $X_Y release yet; run \"create release\" first."; exit 1; fi
    - git fetch --quiet --depth 1 origin tag "$BASE"
    - ARTIFACTS_DIR=old deploy/scripts/fetch-packages.py --os ubuntu24 --release "$BASE"
    - ARTIFACTS_DIR=new deploy/scripts/fetch-packages.py --os ubuntu24 --set latest
    - KIND=$(ci/compat-check.sh --base "$BASE" --old old --new new --report report.md)
    - if [ "$KIND" = major ]; then NEXT=$((${X_Y%.*} + 1)).0; else NEXT=${X_Y%.*}.$((${X_Y#*.} + 1)); fi
    - echo "Proposed release $NEXT ($KIND)"
    - gitlab/scripts/api.py propose --version "$NEXT" --report report.md

create release:
  extends: .release job
  rules:
    - if: $CI_COMMIT_BRANCH != "main" || $CI_PIPELINE_SOURCE !~ /^(push|schedule|web)$/
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: [VERSION]
    - when: manual
      allow_failure: true
  script:
    - gitlab/scripts/api.py create-release

tag patch:
  extends: .release job
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release\/[0-9]+\.[0-9]+$/
  script:
    - gitlab/scripts/api.py tag-patch

backport:
  extends: .release job
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
  script:
    - gitlab/scripts/api.py backport

# A release needs every component built and tested in its tag pipeline.
publish release:
  extends: .release job
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
  needs: !reference [.built and tested, needs]
  before_script:
    - !reference [.internal-ca, before_script]
    - !reference [.version, before_script]
  script:
    # A release needs cognos-grpc for ol10 (from Nexus, pinned): without it this job fails.
    - ARTIFACTS_DIR=grpc deploy/scripts/fetch-packages.py --os ol10 --grpc
    - >-
      ci/dev-set.py --version "$COGNOS_VERSION" --pipeline "$CI_PIPELINE_ID" --complete
      --extra "ol10=$(ls grpc/cognos-grpc-*.rpm | head -n 1)" --out release
    - gitlab/scripts/api.py publish-release --dir release

# ---------------------------------------------------------------------------
# 7. Sync from the component repositories
# ---------------------------------------------------------------------------
# Until the component repositories stop, their main branches are brought into
# this repository: for each component whose repository's main is not here yet,
# a merge request from sync/<component> (git subtree merge, history kept).
# Runs only with SYNC_COMPONENTS=true on main: the nightly schedule sets it (so
# the nightly pipeline is a full build, the dev set refresh and the sync), or a
# run by hand (Build > Pipelines > Run pipeline, or the schedule's Play). To stop
# the sync, set SYNC_COMPONENTS to false in the schedule; to stop the nightly
# pipeline, make the schedule inactive. See docs/ci.md, "Sync".

sync components:
  stage: release
  image: python:3.12
  resource_group: sync
  needs:
    - {job: test ci, optional: true}
  rules:
    - if: $SYNC_COMPONENTS == "true" && $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(schedule|web)$/
  variables:
    # The merges need the components' history in this repository.
    GIT_DEPTH: 0
  before_script:
    - !reference [.internal-ca, before_script]
  script:
    - gitlab/scripts/api.py sync

# ---------------------------------------------------------------------------
# 8. Deploy to the lab
# ---------------------------------------------------------------------------
# Run by hand on a main pipeline: deploys this pipeline's ubuntu24 packages
# (completed from the newest dev set) with the playbooks to two lab machines,
# checks that Cognos runs, then removes it and checks that nothing is left
# (deploy/scripts/test-deploy.sh). The machines are only targets, not runners.
# DEPLOY_SSH_KEY (root on both, base64) is a protected variable, so the job is
# offered on main pipelines only. See docs/ci.md, "Deploy to the lab".

deploy cognos:
  stage: deploy
  image: $CI_REGISTRY_IMAGE:ubuntu22-main
  resource_group: lab-deploy
  needs: !reference [.built and tested, needs]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(push|web)$/
      when: manual
      allow_failure: true
  variables:
    DEPLOY_MANAGEMENT_SERVER: msl-ssg-vm22.msl.lab
    DEPLOY_APPLICATION_SERVER: msl-ssg-srf06.msl.lab
    ANSIBLE_FORCE_COLOR: "true"
  before_script:
    - !reference [.internal-ca, before_script]
    - DEPLOY_KEY=$(mktemp)
    - printf '%s' "$DEPLOY_SSH_KEY" | base64 -d > "$DEPLOY_KEY"
    - chmod 600 "$DEPLOY_KEY"
    - (cd deploy && ansible-galaxy collection install -r collections/requirements.yml)
  script:
    - deploy/scripts/fetch-packages.py --os ubuntu24 --pipeline "$CI_PIPELINE_ID"
    - >-
      deploy/scripts/test-deploy.sh --management "$DEPLOY_MANAGEMENT_SERVER"
      --application "$DEPLOY_APPLICATION_SERVER" --key "$DEPLOY_KEY"

# ---------------------------------------------------------------------------
# 9. Other jobs
# ---------------------------------------------------------------------------

# Unit tests of the CI scripts (ci/, gitlab/scripts/, build.sh, deploy/scripts/)
# and read-only smoke tests against this GitLab. See gitlab/scripts/tests/.
test ci:
  stage: test
  image: python:3.12
  needs: []
  rules:
    - changes: [ci/**/*, gitlab/**/*, build.sh, deploy/scripts/**/*]
  before_script:
    - !reference [.internal-ca, before_script]
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends shellcheck > /dev/null
  script:
    - gitlab/scripts/tests/run.sh --smoke

# Runs in every pipeline, so every merge request has one.
check version:
  stage: test
  image: alpine:3.19.1
  needs: []
  script:
    - |
      [ "$(grep -c '' VERSION)" -eq 1 ] && grep -Eqx '[0-9]+\.[0-9]+' VERSION || {
        echo "VERSION must contain MAJOR.MINOR only, for example 1.6. Found: $(cat VERSION)"
        exit 1
      }

# amo-prof: build the wheel and run its tests, as its own CI does. Only when
# profilers/amo-prof changes.
test amo-prof:
  stage: test
  image: python:3.12
  needs: []
  rules:
    # Not in tag pipelines: amo-prof is not part of a release (nothing of it is
    # packaged), and a release branch can carry an older amo-prof.
    - if: $CI_COMMIT_TAG
      when: never
    - changes: [profilers/amo-prof/**/*]
  script:
    - cd profilers/amo-prof
    - bash scripts/build_wheel.sh dist
    - python -m pip install dist/amoprof-*.whl pytest
    - (cd /tmp && amoprof --version && amoprof compare --help > /dev/null)
    - bash -n install.sh
    - bash install.sh --help > /dev/null
    - bash scripts/run_tests.sh

# The tools templates included above; the jobs below replace them.
get branch:
  rules:
    - when: never
build docker:
  rules:
    - when: never
ansible-lint:
  rules:
    - when: never

# ansible: lint deploy/ when it changes.
.deploy:
  variables:
    # The slug, because '/' is not allowed in a Docker tag (release/X.Y), and
    # so that a merge request never overwrites main's image.
    DOCKER_BRANCH_NAME: $CI_COMMIT_REF_SLUG
  rules:
    # Not in tag pipelines: linting deploy/ is not part of a release, and the
    # image build pulls from Docker Hub every time.
    - if: $CI_COMMIT_TAG
      when: never
    - changes: [deploy/**/*]

# The ansible-lint image. The Dockerfile copies scripts/dependencies, which
# lives under deploy/, so deploy/ is the build context.
build ansible image:
  extends: [build docker, .deploy]
  stage: build-images
  variables:
    DOCKERFILE_NAME: ubuntu22
    DOCKERFILE_PATH: deploy/scripts/docker/ubuntu22.DOCKERFILE
    DOCKER_CONTEXT: deploy
  script:
    - |
      docker buildx build \
        --cache-from type=registry,ref=$CACHE_TAG \
        --cache-to type=registry,ref=$CACHE_TAG \
        --push \
        --tag $IMAGE_TAG \
        --tag $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$GIT_TAG_VERSION \
        --file $DOCKERFILE_PATH $DOCKER_CONTEXT \
        --provenance false

# ansible.cfg, .ansible-lint and the playbooks are under deploy/.
lint ansible:
  extends: [ansible-lint, .deploy]
  needs: ["build ansible image"]
  script:
    - cd deploy
    - ansible-lint

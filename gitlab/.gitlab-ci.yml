# Cognos monorepo pipeline. One pipeline per event; there are no child
# pipelines. See docs/ci.md for the pipeline map.
#
# Selection lives in ci/selection.yml. Jobs use it through
# rules:changes: !reference [.selection, <key>], and ci/scripts/plan.sh (the
# plan job, ./build.sh --plan) applies the same lists.
#
# The pipeline that came with deploy/ (deploy/.gitlab-ci.yml) is deliberately
# not included. Its deploy stage restores VM snapshots and deploys as root to
# shared lab VMs.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # 1. Merge requests.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # 2. Release tags vX.Y.Z.
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/
    # 3. Every other tag (the imported core/v*, mgmt-fw/v*, ... tags) never runs.
    - if: $CI_COMMIT_TAG
      when: never
    # 4. A push that creates a branch has no 'before' commit.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"
      when: never
    # 5. Pushes to main and to release/X.Y.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release[\/][0-9]+[.][0-9]+$/
    # 6. Schedules on main.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"
    # 7. Pipelines run from the web UI.
    - if: $CI_PIPELINE_SOURCE == "web"
    # 8. Everything else: feature-branch pushes, triggers, API.
    - when: never

stages:
  - .pre
  - plan
  - images
  - build
  - test
  - analysis
  - publish
  - release

default:
  # Only merge-request jobs are interruptible (rules set interruptible: true
  # for them); main, release and tag jobs always finish.
  interruptible: false

variables:
  GIT_SUBMODULE_STRATEGY: none

include:
  # Pinned to a full commit of dfs/svk/tools main.
  - project: dfs/svk/tools
    ref: efbaaadf825e3525126e506fc6400c91c794f406
    file: .config/ci/gitlab/defaults.yml
  - project: dfs/svk/tools
    ref: efbaaadf825e3525126e506fc6400c91c794f406
    file: .config/ci/gitlab/docker.yml
  # The ansible-lint job of deploy/, adjusted in gitlab/jobs/deploy.yml.
  - local: deploy/.config/ci/gitlab/lint.yml
  - local: ci/selection.yml
  - local: gitlab/jobs/*.yml

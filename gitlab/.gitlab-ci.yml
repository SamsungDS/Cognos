# Cognos monorepo pipeline. One pipeline per event, no child pipelines.
# See docs/ci.md.
#
# The pipeline that came with deploy/ (deploy/.gitlab-ci.yml) is deliberately
# not included. Its deploy stage restores VM snapshots and deploys as root to
# shared lab VMs.

include:
  - project: dfs/svk/tools
    ref: efbaaadf825e3525126e506fc6400c91c794f406
    file: .config/ci/gitlab/defaults.yml
  - project: dfs/svk/tools
    ref: efbaaadf825e3525126e506fc6400c91c794f406
    file: .config/ci/gitlab/docker.yml
  - local: deploy/.config/ci/gitlab/lint.yml

workflow:
  rules:
    # Merge requests.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Release tags vX.Y.Z. A tag push has no 'before' commit, so this comes
    # before the new-branch rule. The imported prefixed tags never run.
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_COMMIT_TAG
      when: never
    # Pushes to main. main always exists, so the new-branch rule below does
    # not apply to it.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    # A push that creates a branch has no 'before' commit.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"
      when: never
    # Pushes to release/X.Y.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release\/[0-9]+\.[0-9]+$/
    # Schedules and runs from the web UI.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    # Nothing else matches, so nothing else runs.

stages:
  - build-images
  - build
  - test
  - scan
  - publish
  - release

# Path lists for rules:changes, used with !reference.
# A change in .rebuild-all rebuilds every component.
# A change in one component's list rebuilds only that component.
.rebuild-all:
  changes:
    - components/core/**/*
    - components/mgmt-fw/**/*
    - gitlab/**/*
    - VERSION
    - build.sh
.paths-core:
  changes:
    - components/core/**/*
.paths-mgmt-fw:
  changes:
    - components/mgmt-fw/**/*
.paths-cxl:
  changes:
    - components/cxl/**/*
.paths-slat:
  changes:
    - components/slat/**/*
.paths-ras:
  changes:
    - components/ras/**/*
.paths-me:
  changes:
    - components/me/**/*
.paths-node:
  changes:
    - components/node/**/*
.paths-sapp:
  changes:
    - apps/sapp/**/*
.paths-amo-prof:
  changes:
    - profilers/amo-prof/**/*
.paths-deploy:
  changes:
    - deploy/**/*

# Runs in every pipeline, so every merge request has one.
check version:
  stage: test
  image: alpine:3.19.1
  needs: []
  script:
    - |
      [ "$(grep -c '' VERSION)" -eq 1 ] && grep -Eqx '[0-9]+\.[0-9]+' VERSION || {
        echo "VERSION must contain MAJOR.MINOR only, for example 1.6. Found: $(cat VERSION)"
        exit 1
      }

# The template jobs are replaced by the jobs below.
get branch:
  rules:
    - when: never
build docker:
  rules:
    - when: never
ansible-lint:
  rules:
    - when: never

.deploy-rules:
  variables:
    # The slug, because '/' is not allowed in a Docker tag (release/X.Y), and
    # so that a merge request never overwrites main's image.
    DOCKER_BRANCH_NAME: $CI_COMMIT_REF_SLUG
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.paths-deploy, changes]
    # workflow rules limit pushes to main and release/X.Y
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      changes: !reference [.paths-deploy, changes]
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"

# The ansible-lint image. The Dockerfile copies scripts/dependencies, which
# lives under deploy/, so deploy/ is the build context.
build ansible image:
  extends: [build docker, .deploy-rules]
  stage: build-images
  variables:
    DOCKERFILE_NAME: ubuntu22
    DOCKERFILE_PATH: deploy/scripts/docker/ubuntu22.DOCKERFILE
    DOCKER_CONTEXT: deploy
  script:
    - |
      docker buildx build \
        --cache-from type=registry,ref=$CACHE_TAG \
        --cache-to type=registry,ref=$CACHE_TAG \
        --push \
        --tag $IMAGE_TAG \
        --tag $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$GIT_TAG_VERSION \
        --file $DOCKERFILE_PATH $DOCKER_CONTEXT \
        --provenance false

# ansible.cfg, .ansible-lint and the playbooks are under deploy/.
lint ansible:
  extends: [ansible-lint, .deploy-rules]
  needs: ["build ansible image"]
  script:
    - cd deploy
    - ansible-lint

# Component builds: "build <component> image" builds the component's own
# Dockerfile, "build <component>" builds its packages in that image with the
# root build.sh. See docs/ci.md, "Builds".

# The one version of every package built in this pipeline, from VERSION
# (X.Y) and the vX.Y.Z tags.
.set version:
  before_script:
    - |
      X=$(cut -d. -f1 VERSION)
      Y=$(cut -d. -f2 VERSION)
      if [ -n "$CI_COMMIT_TAG" ]; then
        COGNOS_VERSION=${CI_COMMIT_TAG#v}
      elif [ -n "$CI_MERGE_REQUEST_IID" ]; then
        COGNOS_VERSION=$X.$((Y + 1)).0~dev.0.mr$CI_MERGE_REQUEST_IID.$CI_PIPELINE_IID
      else
        case $CI_COMMIT_BRANCH in
          release/*)
            if [ "${CI_COMMIT_BRANCH#release/}" != "$X.$Y" ]; then
              echo "Branch $CI_COMMIT_BRANCH, but VERSION is $X.$Y"
              exit 1
            fi
            # The patch after the highest vX.Y.* tag (none: patch 0).
            P=$(git ls-remote --tags origin "refs/tags/v$X.$Y.*" | sed -n "s|.*refs/tags/v$X\.$Y\.\([0-9][0-9]*\)$|\1|p" | sort -n | tail -n 1)
            COGNOS_VERSION=$X.$Y.$((${P:--1} + 1))~rc.$CI_PIPELINE_IID
            ;;
          # main, and schedules or web runs on any other branch.
          *) COGNOS_VERSION=$X.$((Y + 1)).0~dev.$CI_PIPELINE_IID ;;
        esac
      fi
      export COGNOS_VERSION
      echo "Cognos version: $COGNOS_VERSION"

# Pushes $CI_REGISTRY/$CI_PROJECT_PATH/<component>:<os>-<ref slug> and
# :<os>-<short sha>. The component directory is the build context, as in the
# component repository.
.component image:
  extends: build docker
  stage: build-images
  needs: []
  variables:
    DOCKER_BRANCH_NAME: $CI_COMMIT_REF_SLUG
    CI_REGISTRY_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH/$COMPONENT
    DOCKERFILE_NAME: $OS
  script:
    - cd $COMPONENT_DIR
    # The template's second tag is <os>-<git describe>, which means nothing
    # here (imported tags); name the commit instead.
    - GIT_TAG_VERSION=$CI_COMMIT_SHORT_SHA
    - echo "version tag (pushed) - $CI_REGISTRY_IMAGE:${DOCKERFILE_NAME}-$GIT_TAG_VERSION"
    - !reference [build docker, script]
  parallel:
    matrix:
      - OS: [ubuntu24, ol10]

# The image already has the component's dependencies, so its
# scripts/dependencies/install.sh is not run again. The per-commit tag, so that
# overlapping pipelines on one ref never use each other's image.
.component build:
  extends: .set version
  stage: build
  image:
    name: $CI_REGISTRY/$CI_PROJECT_PATH/$COMPONENT:$OS-$CI_COMMIT_SHORT_SHA
    pull_policy: always
  script:
    - ./build.sh --native "$COMPONENT" --os "$OS"
  artifacts:
    name: $CI_JOB_NAME
    expire_in: 14 days
    paths:
      - $COMPONENT_DIR/build/artifacts/
  parallel:
    matrix:
      - OS: [ubuntu24, ol10]

.core:
  variables:
    COMPONENT: core
    COMPONENT_DIR: components/core
  # Tags, schedules and web runs build everything. Merge requests and pushes
  # (workflow rules limit them to main and release/X.Y) build on a
  # .rebuild-all change or a change in the component's own paths.
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH)
      changes: !reference [.rebuild-all, changes]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH)
      changes: !reference [.paths-core, changes]
build core image:
  extends: [.component image, .core]
build core:
  extends: [.component build, .core]
  needs: ["build core image"]

.mgmt-fw:
  variables:
    COMPONENT: mgmt-fw
    COMPONENT_DIR: components/mgmt-fw
  # Tags, schedules and web runs build everything. Merge requests and pushes
  # (workflow rules limit them to main and release/X.Y) build on a
  # .rebuild-all change or a change in the component's own paths.
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH)
      changes: !reference [.rebuild-all, changes]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH)
      changes: !reference [.paths-mgmt-fw, changes]
build mgmt-fw image:
  extends: [.component image, .mgmt-fw]
build mgmt-fw:
  extends: [.component build, .mgmt-fw]
  needs:
    - build mgmt-fw image
    - {job: build core, optional: true}


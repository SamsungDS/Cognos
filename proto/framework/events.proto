syntax = "proto3";

package svk;

// Event structure
message EventHeader {
  string cluster_name = 1 [ json_name = "cluster_name" ];
  string node_name = 2 [ json_name = "node_name" ];
}

message EventPayload {
  string category = 1;
  string domain = 2;
  string feature_name = 3 [ json_name = "feature_name" ];
  string msg = 4;
  string severity = 5;
  string source = 6;
  string source_type = 7 [ json_name = "source_type" ];
  string tag = 8;
  uint64 timestamp = 9;
  string timestamp_formatted = 10 [ json_name = "timestamp_formatted" ];
  map<string, string> observations = 11;
}

message EventData {
  EventHeader event_header = 1 [ json_name = "event_header" ];
  EventPayload event_payload = 2 [ json_name = "event_payload" ];
}
